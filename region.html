<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Region | Everwyn Online</title>

    <link
        rel="stylesheet"
        href="css/everwyn.css"
    >

    <style>

        .region-hero {
            position: relative;

            min-height: 340px;

            display: flex;
            align-items: flex-end;

            padding: 40px;

            margin-bottom: 30px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 78% 22%,
                    rgba(214, 186, 124, 0.14),
                    transparent 26%
                ),
                radial-gradient(
                    circle at 20% 70%,
                    rgba(143, 165, 148, 0.17),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 45% 20%,
                    rgba(128, 102, 168, 0.18),
                    transparent 38%
                ),
                linear-gradient(
                    140deg,
                    rgba(37, 43, 51, 0.98),
                    rgba(17, 19, 29, 0.97)
                );
        }


        .region-hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
        }


        .eyebrow {
            margin-bottom: 10px;

            color:
                var(--everwyn-gold-light);

            font-size: 12px;

            letter-spacing: 0.22em;

            text-transform: uppercase;
        }


        .region-hero h1 {
            margin-bottom: 12px;

            color:
                var(--everwyn-moon);
        }


        .region-hero p {
            max-width: 650px;
            margin: 0;
            font-size: 16px;
        }


        /*
            DECORATIVE SKY LIGHT
        */

        .region-light {
            position: absolute;

            width: 170px;
            height: 170px;

            top: 45px;
            right: 70px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(234, 217, 174, 0.32),
                    rgba(183, 161, 211, 0.10) 45%,
                    transparent 70%
                );

            filter: blur(2px);

            pointer-events: none;
        }


        /*
            REGION INFORMATION
        */

        .region-info {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 22px;
        }


        /*
            SECTION HEADING
        */

        .section-heading {
            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;
        }


        .section-heading h2 {
            margin: 0 0 6px;
        }


        .section-heading p {
            margin: 0;
        }


        /*
            LOCATIONS
        */

        #locations {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(270px, 1fr)
                );

            gap: 18px;
        }


        .location-card {
            position: relative;

            min-height: 300px;

            display: flex;

            flex-direction: column;

            padding: 25px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 85% 12%,
                    rgba(214, 186, 124, 0.09),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 15% 80%,
                    rgba(128, 102, 168, 0.11),
                    transparent 35%
                ),
                rgba(255, 255, 255, 0.055);

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 20px;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }


        .location-card:hover {
            transform:
                translateY(-4px);

            border-color:
                rgba(183, 161, 211, 0.34);

            background:
                rgba(255, 255, 255, 0.075);

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.22);
        }


        .location-symbol {
            width: 46px;
            height: 46px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 24px;

            border-radius: 14px;

            background:
                rgba(183, 161, 211, 0.11);

            border:
                1px solid
                rgba(183, 161, 211, 0.18);

            color:
                var(--everwyn-gold-light);

            font-size: 20px;
        }


        .location-card h3 {
            margin: 0 0 10px;

            color:
                var(--everwyn-moon);

            font-size: 24px;
        }


        .location-description {
            flex-grow: 1;

            margin: 0;

            font-size: 14px;
        }


        .location-meta {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin:
                18px 0;
        }


        .location-type {
            display: inline-flex;

            padding:
                5px 9px;

            border-radius: 999px;

            color:
                var(--everwyn-lilac);

            background:
                rgba(128, 102, 168, 0.14);

            border:
                1px solid
                rgba(183, 161, 211, 0.20);

            font-size: 11px;

            text-transform: capitalize;
        }


        .location-button {
            width: 100%;
        }


        /*
            MESSAGES
        */

        .loading-card,
        .empty-card,
        .error-message {

            grid-column:
                1 / -1;

            padding: 30px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.055);

            border:
                1px solid
                var(--everwyn-border);

            border-radius: 18px;
        }


        .error-message h3,
        .empty-card h3 {
            margin-top: 0;
        }


        /*
            BOTTOM NAVIGATION
        */

        .bottom-navigation {
            display: flex;

            align-items: center;

            justify-content: space-between;

            flex-wrap: wrap;

            gap: 15px;

            margin-top: 35px;
        }


        .back-link {
            color:
                var(--everwyn-text-soft);

            text-decoration: none;
        }


        .back-link:hover {
            color:
                var(--everwyn-moon);
        }


        /*
            MOBILE
        */

        @media (
            max-width: 700px
        ) {

            .region-hero {
                min-height: 390px;

                padding: 28px;
            }


            .region-light {
                width: 110px;
                height: 110px;

                top: 30px;
                right: 30px;
            }


            .section-heading {
                align-items: flex-start;

                flex-direction: column;
            }


            #locations {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <main class="everwyn-page everwyn-appear">


        <!-- NAVIGATION -->

        <nav class="everwyn-nav">

            <a
                class="everwyn-logo"
                href="game.html"
            >
                EVERWYN
            </a>


            <div class="everwyn-nav-links">

                <a href="game.html">
                    Home
                </a>

                <a href="explore.html">
                    Explore
                </a>

                <a href="player-profile.html?id=3">
                    Character
                </a>

            </div>

        </nav>



        <!-- REGION HERO -->

        <section
            class="
                everwyn-panel
                everwyn-glow
                region-hero
            "
        >

            <div
                class="region-light"
                aria-hidden="true"
            ></div>


            <div class="region-hero-content">

                <div class="eyebrow">
                    Everwyn Region
                </div>


                <h1 id="region-name">
                    Loading Everwyn...
                </h1>


                <p id="region-description">

                    Discovering this part
                    of the world...

                </p>


                <div
                    class="region-info"
                    id="region-info"
                ></div>

            </div>

        </section>



        <!-- LOCATIONS -->

        <section>

            <div class="section-heading">

                <div>

                    <div class="eyebrow">
                        Destinations
                    </div>


                    <h2>
                        Places to Explore
                    </h2>


                    <p>
                        Step into businesses,
                        gathering places,
                        neighborhoods, and other
                        destinations throughout
                        this region.
                    </p>

                </div>

            </div>


            <div id="locations">

                <div class="loading-card">

                    <p>
                        Discovering places...
                    </p>

                </div>

            </div>

        </section>



        <!-- BACK -->

        <div class="bottom-navigation">

            <a
                class="back-link"
                href="explore.html"
            >
                ← Back to Regions
            </a>

        </div>


    </main>



    <script>

        /*
            SUPABASE CONNECTION
        */

        const SUPABASE_URL =
            "https://iajvwhrjutqkqqvbknth.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_5zhAgTZggC_EnEc0o834_g_8h9yudIz";


        /*
            PAGE ELEMENTS
        */

        const regionName =
            document.getElementById(
                "region-name"
            );


        const regionDescription =
            document.getElementById(
                "region-description"
            );


        const regionInfo =
            document.getElementById(
                "region-info"
            );


        const locationsContainer =
            document.getElementById(
                "locations"
            );


        /*
            ESCAPE HTML
        */

        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value ?? "";


            return div.innerHTML;

        }


        /*
            LOAD REGION
        */

        async function loadRegion() {

            try {

                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );


                const regionId =
                    urlParams.get(
                        "id"
                    );


                /*
                    NO REGION SELECTED
                */

                if (!regionId) {

                    regionName.textContent =
                        "Region Not Found";


                    regionDescription.textContent =
                        "No region was selected.";


                    regionInfo.innerHTML =
                        "";


                    locationsContainer.innerHTML = `

                        <div class="empty-card">

                            <h3>
                                No destination selected.
                            </h3>

                            <p>
                                Return to Explore Everwyn
                                and choose a region.
                            </p>

                        </div>

                    `;


                    return;

                }


                /*
                    LOAD SELECTED REGION
                */

                const regionResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/world_regions" +
                        "?id=eq." +
                        encodeURIComponent(
                            regionId
                        ) +
                        "&is_active=eq.true" +
                        "&is_unlocked=eq.true" +
                        "&apikey=" +
                        encodeURIComponent(
                            SUPABASE_KEY
                        )

                    );


                if (!regionResponse.ok) {

                    throw new Error(
                        "Could not load region. HTTP " +
                        regionResponse.status
                    );

                }


                const regions =
                    await regionResponse.json();


                /*
                    REGION DOES NOT EXIST
                */

                if (!regions.length) {

                    regionName.textContent =
                        "Region Not Found";


                    regionDescription.textContent =
                        "This region is not currently available.";


                    regionInfo.innerHTML =
                        "";


                    locationsContainer.innerHTML = `

                        <div class="empty-card">

                            <h3>
                                This path is closed.
                            </h3>

                            <p>
                                This region could not
                                be found or is not
                                currently open.
                            </p>

                        </div>

                    `;


                    return;

                }


                const region =
                    regions[0];


                /*
                    UPDATE PAGE
                */

                document.title =
                    region.name +
                    " | Everwyn Online";


                regionName.textContent =
                    region.name;


                regionDescription.textContent =
                    region.description ||
                    "Explore this part of Everwyn.";


                regionInfo.innerHTML = `

                    <span class="everwyn-badge">

                        ${escapeHtml(
                            region.region_type ||
                            "Region"
                        )}

                    </span>


                    <span class="everwyn-badge">
                        Open for Exploration
                    </span>

                `;


                /*
                    LOAD LOCATIONS
                */

                locationsContainer.innerHTML = `

                    <div class="loading-card">

                        <p>
                            Discovering places...
                        </p>

                    </div>

                `;


                const locationResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/world_locations" +
                        "?region_id=eq." +
                        encodeURIComponent(
                            regionId
                        ) +
                        "&order=id.asc" +
                        "&apikey=" +
                        encodeURIComponent(
                            SUPABASE_KEY
                        )

                    );


                if (!locationResponse.ok) {

                    throw new Error(
                        "Could not load locations. HTTP " +
                        locationResponse.status
                    );

                }


                const locations =
                    await locationResponse.json();


                /*
                    NO LOCATIONS
                */

                if (!locations.length) {

                    locationsContainer.innerHTML = `

                        <div class="empty-card">

                            <h3>
                                Nothing has been mapped here yet.
                            </h3>

                            <p>
                                There aren't any discovered
                                places in this region yet.
                            </p>

                        </div>

                    `;


                    return;

                }


                locationsContainer.innerHTML =
                    "";


                /*
                    BUILD LOCATION CARDS
                */

                locations.forEach(
                    (
                        location
                    ) => {

                        const card =
                            document.createElement(
                                "article"
                            );


                        card.className =
                            "location-card";


                        card.innerHTML = `

                            <div class="location-symbol">
                                ✦
                            </div>


                            <h3>

                                ${escapeHtml(
                                    location.name
                                )}

                            </h3>


                            <p class="location-description">

                                ${escapeHtml(
                                    location.description ||
                                    "A place waiting to be explored."
                                )}

                            </p>


                            <div class="location-meta">

                                <span class="location-type">

                                    ${escapeHtml(
                                        location.location_type ||
                                        "Unknown"
                                    )}

                                </span>


                                <span class="everwyn-badge">
                                    Available
                                </span>

                            </div>


                            <button
                                class="
                                    everwyn-button
                                    location-button
                                "
                                type="button"
                                onclick="visitLocation(${Number(
                                    location.id
                                )})"
                            >

                                Enter
                                ${escapeHtml(
                                    location.name
                                )}

                            </button>

                        `;


                        locationsContainer
                            .appendChild(
                                card
                            );

                    }

                );


            } catch (error) {

                console.error(
                    "Everwyn region loading error:",
                    error
                );


                regionName.textContent =
                    "Everwyn could not load";


                regionDescription.textContent =
                    "Something went wrong while loading this region.";


                regionInfo.innerHTML =
                    "";


                locationsContainer.innerHTML = `

                    <div class="error-message">

                        <h3>
                            Unable to load this region.
                        </h3>


                        <p>
                            ${escapeHtml(
                                error.message
                            )}
                        </p>


                        <button
                            class="everwyn-button"
                            type="button"
                            onclick="loadRegion()"
                        >
                            Try Again
                        </button>

                    </div>

                `;

            }

        }


        /*
            VISIT LOCATION
        */

        function visitLocation(
            locationId
        ) {

            window.location.href =
                "location.html?id=" +
                encodeURIComponent(
                    locationId
                );

        }


        /*
            START PAGE
        */

        loadRegion();

    </script>


</body>

</html>
