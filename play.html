<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Everwyn Online — Play
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                #10121b;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

        }


        #everwyn-game {

            position: fixed;

            inset: 0;

        }


        /* ==================================================
           HUD PANELS
        ================================================== */

        .hud-panel {

            position: fixed;

            z-index: 100;

            color:
                #f5efe4;

            background:
                rgba(
                    15,
                    17,
                    27,
                    0.88
                );

            border:
                1px solid
                rgba(
                    213,
                    197,
                    230,
                    0.22
                );

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.28
                );

            backdrop-filter:
                blur(12px);

        }


        /* ==================================================
           PLAYER HUD
        ================================================== */

        #player-hud {

            top: 18px;
            left: 18px;

            width: 210px;

            padding:
                14px 16px;

            border-radius:
                16px;

        }


        .player-name {

            font-size:
                18px;

        }


        .player-level {

            margin-top:
                3px;

            color:
                #b7a1d3;

            font-size:
                11px;

        }


        .stat {

            margin-top:
                10px;

        }


        .stat-label {

            display:
                flex;

            justify-content:
                space-between;

            color:
                #c9c3d0;

            font-size:
                10px;

        }


        .stat-bar {

            height:
                5px;

            margin-top:
                4px;

            overflow:
                hidden;

            border-radius:
                999px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.09
                );

        }


        .stat-fill {

            width:
                100%;

            height:
                100%;

            border-radius:
                inherit;

            background:
                linear-gradient(
                    90deg,
                    #9174b1,
                    #c3a6df
                );

        }


        /* ==================================================
           LOCATION
        ================================================== */

        #location-hud {

            top: 18px;

            left: 50%;

            transform:
                translateX(-50%);

            padding:
                10px 22px;

            border-radius:
                14px;

            text-align:
                center;

        }


        #location-name {

            font-size:
                15px;

            letter-spacing:
                0.06em;

        }


        #location-subtitle {

            margin-top:
                3px;

            color:
                #d6ba7c;

            font-size:
                9px;

            letter-spacing:
                0.22em;

        }


        /* ==================================================
           MINI MAP
        ================================================== */

        #mini-map {

            top: 18px;
            right: 18px;

            width: 170px;

            padding:
                12px;

            border-radius:
                16px;

        }


        .mini-title {

            margin-bottom:
                8px;

            color:
                #d6ba7c;

            font-size:
                9px;

            letter-spacing:
                0.14em;

        }


        .mini-world {

            position:
                relative;

            height:
                90px;

            overflow:
                hidden;

            border-radius:
                10px;

            background:

                radial-gradient(
                    circle at center,
                    rgba(
                        183,
                        161,
                        211,
                        0.14
                    ),
                    transparent 35%
                ),

                linear-gradient(
                    90deg,
                    transparent 48%,
                    rgba(
                        183,
                        161,
                        211,
                        0.16
                    ) 49%,
                    rgba(
                        183,
                        161,
                        211,
                        0.16
                    ) 51%,
                    transparent 52%
                ),

                linear-gradient(
                    0deg,
                    transparent 48%,
                    rgba(
                        183,
                        161,
                        211,
                        0.16
                    ) 49%,
                    rgba(
                        183,
                        161,
                        211,
                        0.16
                    ) 51%,
                    transparent 52%
                ),

                #222536;

        }


        .mini-marker {

            position:
                absolute;

            width:
                8px;

            height:
                8px;

            left:
                50%;

            top:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                )
                rotate(45deg);

            background:
                #ead9ae;

            box-shadow:
                0 0 10px
                #ead9ae;

        }


        /* ==================================================
           GOALS
        ================================================== */

        #goals {

            top: 145px;
            right: 18px;

            width: 220px;

            padding:
                14px;

            border-radius:
                16px;

        }


        .goal-title {

            margin-bottom:
                9px;

            color:
                #d6ba7c;

            font-size:
                10px;

            letter-spacing:
                0.14em;

        }


        .goal {

            margin:
                7px 0;

            color:
                #c9c3d0;

            font-size:
                11px;

            line-height:
                1.4;

        }


        .goal.complete {

            color:
                #9bb5a0;

        }


        /* ==================================================
           INTERACTION PROMPT
        ================================================== */

        #interaction-prompt {

            position:
                fixed;

            left:
                50%;

            bottom:
                82px;

            transform:
                translateX(-50%);

            z-index:
                200;

            display:
                none;

            align-items:
                center;

            gap:
                10px;

            padding:
                11px 18px;

            color:
                #f5efe4;

            background:
                rgba(
                    15,
                    17,
                    27,
                    0.95
                );

            border:
                1px solid
                rgba(
                    214,
                    186,
                    124,
                    0.60
                );

            border-radius:
                13px;

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }


        .key {

            width:
                30px;

            height:
                30px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                8px;

            color:
                #252118;

            background:
                #ead9ae;

            font-weight:
                bold;

        }


        /* ==================================================
           NOTIFICATIONS
        ================================================== */

        #notification {

            position:
                fixed;

            z-index:
                300;

            left:
                50%;

            top:
                100px;

            transform:
                translate(
                    -50%,
                    -20px
                );

            max-width:
                430px;

            padding:
                13px 20px;

            color:
                #f5efe4;

            background:
                rgba(
                    28,
                    31,
                    45,
                    0.97
                );

            border:
                1px solid
                rgba(
                    183,
                    161,
                    211,
                    0.35
                );

            border-radius:
                13px;

            opacity:
                0;

            pointer-events:
                none;

            transition:
                opacity 0.25s,
                transform 0.25s;

        }


        #notification.show {

            opacity:
                1;

            transform:
                translate(
                    -50%,
                    0
                );

        }


        /* ==================================================
           BOTTOM MENU
        ================================================== */

        #bottom-menu {

            position:
                fixed;

            z-index:
                100;

            bottom:
                16px;

            left:
                50%;

            transform:
                translateX(-50%);

            display:
                flex;

            gap:
                5px;

            padding:
                7px;

            border-radius:
                16px;

            background:
                rgba(
                    15,
                    17,
                    27,
                    0.89
                );

            border:
                1px solid
                rgba(
                    213,
                    197,
                    230,
                    0.18
                );

            backdrop-filter:
                blur(12px);

        }


        .menu-button {

            border:
                0;

            padding:
                9px 13px;

            border-radius:
                10px;

            color:
                #c9c3d0;

            background:
                transparent;

            font-family:
                inherit;

            font-size:
                11px;

            cursor:
                pointer;

        }


        .menu-button:hover {

            color:
                white;

            background:
                rgba(
                    183,
                    161,
                    211,
                    0.12
                );

        }


        /* ==================================================
           EMERGENCY RETURN
        ================================================== */

        #emergency-return {

            position:
                fixed;

            right:
                18px;

            bottom:
                18px;

            z-index:
                250;

            display:
                none;

            border:
                1px solid
                rgba(
                    214,
                    186,
                    124,
                    0.35
                );

            padding:
                9px 12px;

            border-radius:
                10px;

            color:
                #d8d1c4;

            background:
                rgba(
                    15,
                    17,
                    27,
                    0.90
                );

            font-family:
                inherit;

            font-size:
                10px;

            cursor:
                pointer;

        }


        /* ==================================================
           CONTROLS
        ================================================== */

        #controls {

            position:
                fixed;

            left:
                18px;

            bottom:
                18px;

            z-index:
                100;

            color:
                #9e99aa;

            font-size:
                10px;

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (
            max-width: 760px
        ) {

            #mini-map,
            #goals {

                display:
                    none;

            }


            #player-hud {

                width:
                    155px;

            }


            #location-hud {

                top:
                    115px;

            }


            #bottom-menu {

                max-width:
                    94%;

                overflow-x:
                    auto;

            }


            .menu-button {

                white-space:
                    nowrap;

            }

        }

    </style>

</head>


<body>


    <!-- ================================================
         PHASER GAME
    ================================================= -->

    <div id="everwyn-game"></div>


    <!-- ================================================
         PLAYER HUD
    ================================================= -->

    <div
        id="player-hud"
        class="hud-panel"
    >

        <div class="player-name">
            Yanola
        </div>


        <div class="player-level">
            LEVEL 1 · ONLINE
        </div>


        <div class="stat">

            <div class="stat-label">

                <span>
                    ENERGY
                </span>

                <span>
                    100 / 100
                </span>

            </div>


            <div class="stat-bar">

                <div class="stat-fill">
                </div>

            </div>

        </div>

    </div>


    <!-- ================================================
         LOCATION HUD
    ================================================= -->

    <div
        id="location-hud"
        class="hud-panel"
    >

        <div id="location-name">

            Moonlight District

        </div>


        <div id="location-subtitle">

            EVERWYN · AFTER DUSK

        </div>

    </div>


    <!-- ================================================
         MINI MAP
    ================================================= -->

    <div
        id="mini-map"
        class="hud-panel"
    >

        <div class="mini-title">

            MOONLIGHT DISTRICT

        </div>


        <div class="mini-world">

            <div class="mini-marker">
            </div>

        </div>

    </div>


    <!-- ================================================
         GOALS
    ================================================= -->

    <div
        id="goals"
        class="hud-panel"
    >

        <div class="goal-title">

            CURRENT GOALS

        </div>


        <div
            class="goal"
            id="goal-explore"
        >

            ◇ Explore Moonlight District

        </div>


        <div
            class="goal"
            id="goal-cafe"
        >

            ◇ Enter Moonlight Cafe

        </div>


        <div
            class="goal"
            id="goal-social"
        >

            ◇ Find Cafe Social Hour

        </div>

    </div>


    <!-- ================================================
         INTERACTION PROMPT
    ================================================= -->

    <div id="interaction-prompt">

        <span class="key">
            E
        </span>


        <span id="interaction-text">

            Interact

        </span>

    </div>


    <!-- ================================================
         NOTIFICATION
    ================================================= -->

    <div id="notification">
    </div>


    <!-- ================================================
         CONTROLS
    ================================================= -->

    <div id="controls">

        WASD / ARROWS · MOVE
        &nbsp;&nbsp;
        E · INTERACT

    </div>


    <!-- ================================================
         MENU
    ================================================= -->

    <div id="bottom-menu">

        <button
            class="menu-button"
            onclick="
                showMessage(
                    'Character customization and progression will connect here.'
                )
            "
        >

            Character

        </button>


        <button
            class="menu-button"
            onclick="
                showMessage(
                    'Yanola’s inventory system is coming next.'
                )
            "
        >

            Inventory

        </button>


        <button
            class="menu-button"
            onclick="
                showMessage(
                    'The full Everwyn world map will open here.'
                )
            "
        >

            Map

        </button>


        <button
            class="menu-button"
            onclick="
                showMessage(
                    'Friendships, romance, rivalries, and other relationships will connect here.'
                )
            "
        >

            Relationships

        </button>


        <button
            class="menu-button"
            onclick="
                showMessage(
                    'Yanola’s quests and discoveries will appear here.'
                )
            "
        >

            Quests

        </button>

    </div>


    <!-- ================================================
         DEVELOPMENT RETURN BUTTON
    ================================================= -->

    <button
        id="emergency-return"
        type="button"
    >

        Return to District

    </button>


    <!-- ================================================
         PHASER
    ================================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"
    ></script>


    <!-- ================================================
         EVERWYN SYSTEMS

         ORDER MATTERS.
    ================================================= -->

    <script src="js/player.js"></script>

    <script src="js/interactions.js"></script>


    <!-- ================================================
         EVERWYN SCENES
    ================================================= -->

    <script
        src="js/scenes/MoonlightDistrict.js"
    ></script>

    <script
        src="js/scenes/MoonlightCafe.js"
    ></script>


    <!-- ================================================
         START GAME LAST
    ================================================= -->

    <script src="js/game.js"></script>


</body>

</html>
