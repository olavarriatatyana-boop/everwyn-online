
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#161a30">

<title>Everwyn Online | Your Story Begins Here</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================
   GENERAL WEBSITE SETTINGS
========================================= */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    color: #fff4e8;
    font-family: "Cormorant Garamond", Georgia, serif;
    background: #161a30;
    overflow-x: hidden;
}

/* =========================================
   EVERWYN CINEMATIC BACKGROUND
========================================= */

.world-background {
    position: fixed;
    inset: 0;
    z-index: -1;

    background:
        linear-gradient(
            180deg,
            rgba(10,12,28,0.35) 0%,
            rgba(10,12,28,0.12) 35%,
            rgba(10,12,28,0.48) 100%
        ),
        url("assets/backgrounds/everwyn-welcome.webp")
        center center / cover no-repeat;
}

/* =========================================
   HEADER AND BRANDING
========================================= */

.site-header {
    width: 100%;
    padding: 25px 5%;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
}

.brand {
    color: #ffe5c7;
    text-decoration: none;
    text-align: center;

    font-family: "Cinzel", serif;
    font-size: 27px;
    letter-spacing: 3px;

    text-shadow:
        0 3px 15px rgba(0,0,0,0.85);
}

.brand span {
    display: block;
    font-size: 10px;
    letter-spacing: 7px;
}

/* =========================================
   NAVIGATION MENU
========================================= */

.navigation {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 28px;
}

.navigation a {
    color: #fff4e8;
    text-decoration: none;

    font-family: "Cinzel", serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.95);

    transition: color 0.3s ease;
}

.navigation a:hover {
    color: #f4c99f;
}

.header-login {
    border: 1px solid #d8ae83;
    padding: 12px 25px;
    border-radius: 30px;

    color: #fff4e8;
    text-decoration: none;

    font-family: "Cinzel", serif;
    font-size: 11px;
    letter-spacing: 2px;

    background: rgba(14,18,36,0.65);

    transition:
        background 0.3s ease,
        transform 0.3s ease;
}

.header-login:hover {
    background: rgba(65,43,69,0.85);
    transform: translateY(-2px);
}

/* =========================================
   MAIN WELCOME SCREEN
========================================= */

.landing {
    min-height: calc(100svh - 110px);

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 65px 20px 100px;
}

.hero-content {
    max-width: 1000px;
    animation: appear 1.2s ease both;
}

/* =========================================
   DECORATIVE SYMBOL
========================================= */

.sigil {
    font-size: 43px;
    color: #ffdcac;

    text-shadow:
        0 0 25px rgba(245,183,124,0.85);
}

/* =========================================
   WELCOME LETTERING
========================================= */

.eyebrow {
    margin: 15px 0;

    font-family: "Cinzel", serif;
    font-size: clamp(13px, 2vw, 20px);
    letter-spacing: 7px;
}

/* =========================================
   EVERWYN MAIN TITLE
========================================= */

h1 {
    margin: 0;

    color: #ffe3c9;

    font-size: clamp(65px, 11vw, 150px);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: 3px;

    text-shadow:
        0 3px 2px rgba(40,20,35,0.95),
        0 7px 16px rgba(0,0,0,0.85),
        0 0 35px rgba(255,170,145,0.65);
}

/* =========================================
   ONLINE LETTERING
========================================= */

.online {
    margin: 0;

    font-family: "Cinzel", serif;
    font-size: clamp(14px, 2.5vw, 27px);
    letter-spacing: 13px;
}

/* =========================================
   TAGLINE
========================================= */

.subtitle {
    margin: 27px auto 35px;

    font-family: "Cinzel", serif;
    font-size: clamp(10px, 1.5vw, 15px);
    letter-spacing: 3px;
    line-height: 2;
}

/* =========================================
   TEXT VISIBILITY ENHANCEMENTS
========================================= */

.eyebrow,
.online,
.subtitle {
    color: #fff3e5;

    text-shadow:
        0 2px 5px rgba(0,0,0,0.95),
        0 4px 15px rgba(0,0,0,0.85);
}

/* =========================================
   BUTTON CONTAINER
========================================= */

.hero-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

/* =========================================
   MAIN BUTTON
========================================= */

.hero-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 240px;
    padding: 18px 25px;

    border: 1px solid #e8b78c;
    border-radius: 35px;

    font-family: "Cinzel", serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-decoration: none;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.hero-button:hover {
    transform: translateY(-4px);

    box-shadow:
        0 0 25px rgba(255,203,166,0.45);
}

/* =========================================
   ENTER EVERWYN BUTTON
========================================= */

.enter-button {
    color: #302038;
    font-weight: 600;

    background:
        linear-gradient(
            120deg,
            #fff0e0,
            #e5b1c6,
            #f2cda9
        );

    box-shadow:
        0 5px 20px rgba(0,0,0,0.45),
        0 0 18px rgba(255,205,180,0.25);
}

/* =========================================
   FOOTER
========================================= */

.site-footer {
    position: relative;

    text-align: center;
    padding: 20px;

    color: #f5ddc5;

    font-family: "Cinzel", serif;
    font-size: 10px;
    letter-spacing: 2px;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.95);
}

/* =========================================
   ANIMATIONS
========================================= */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================================
   MOBILE RESPONSIVENESS
========================================= */

@media (max-width: 700px) {

    .site-header {
        flex-direction: column;
        gap: 18px;
    }

    .navigation {
        gap: 15px;
    }

    .navigation a {
        font-size: 9px;
    }

    .header-login {
        padding: 10px 20px;
    }

    .landing {
        min-height: auto;
        padding: 85px 15px 110px;
    }

    h1 {
        font-size: clamp(53px, 13vw, 90px);
    }

    .eyebrow {
        letter-spacing: 4px;
    }

    .online {
        letter-spacing: 8px;
    }

    .hero-button {
        width: min(100%, 320px);
    }
}

/* =========================================
   ACCESSIBILITY
========================================= */

@media (prefers-reduced-motion: reduce) {

    html {
        scroll-behavior: auto;
    }

    .hero-content {
        animation: none;
    }

    .hero-button,
    .header-login {
        transition: none;
    }
}

</style>
</head>

<body>

<!-- CINEMATIC BACKGROUND -->

<div
    class="world-background"
    aria-hidden="true">
</div>

<!-- WEBSITE HEADER -->

<header class="site-header">

    <a href="index.html" class="brand">
        Everwyn
        <span>ONLINE</span>
    </a>

    <!-- NAVIGATION -->

    <nav class="navigation" aria-label="Main navigation">

        <a href="index.html">HOME</a>

        <a href="#welcome">WORLD</a>

        <a href="#welcome">FEATURES</a>

        <a href="#welcome">COMMUNITY</a>

        <a href="#welcome">ABOUT</a>

    </nav>

    <!-- LOGIN -->

    <a href="login.html" class="header-login">
        ✦ LOG IN
    </a>

</header>

<!-- WELCOME SCREEN -->

<main class="landing" id="welcome">

    <div class="hero-content">

        <div class="sigil">✧</div>

        <p class="eyebrow">
            WELCOME TO
        </p>

        <h1>Everwyn</h1>

        <p class="online">
            ONLINE
        </p>

        <p class="subtitle">
            YOUR STORY BEGINS BEYOND THE ORDINARY
        </p>

        <!-- ENTER GAME BUTTON -->

        <div class="hero-buttons">

            <a
                href="login.html"
                class="hero-button enter-button">
                ✦ ENTER EVERWYN ✦
            </a>

        </div>

    </div>

</main>

<!-- FOOTER -->

<footer class="site-footer">
    ✦ EXPLORE · CREATE · CONNECT · BELONG ✦
</footer>

</body>
</html>
