<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Everwyn Online</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: #f5efe6;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(158, 131, 184, 0.20),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 20% 80%,
                    rgba(71, 112, 89, 0.18),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 85% 70%,
                    rgba(68, 103, 124, 0.18),
                    transparent 32%
                ),

                linear-gradient(
                    145deg,
                    #10151b,
                    #171b28 52%,
                    #10141b
                );
        }


        /* ===============================================
           BACKGROUND
        =============================================== */

        .world-background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }


        .world-background::before {
            content: "";

            position: absolute;
            inset: 0;

            opacity: 0.35;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.13) 1px,
                    transparent 1px
                );

            background-size:
                46px 46px;
        }


        .moon {
            position: absolute;

            width: 330px;
            height: 330px;

            top: -90px;
            right: -60px;

            border-radius: 50%;

            opacity: 0.17;

            background:
                radial-gradient(
                    circle at 35% 35%,
                    #fff7dc,
                    #d6c79f 62%,
                    #81775f
                );

            box-shadow:
                0 0 100px
                rgba(232, 211, 159, 0.22);
        }


        .mist {
            position: absolute;

            width: 700px;
            height: 300px;

            left: -180px;
            bottom: -120px;

            border-radius: 50%;

            background:
                rgba(104, 138, 120, 0.10);

            filter: blur(60px);
        }


        /* ===============================================
           LANDING CONTENT
        =============================================== */

        .landing {
            position: relative;
            z-index: 10;

            width: min(850px, 90%);

            padding: 60px 35px;

            text-align: center;
        }


        .eyebrow {
            margin-bottom: 18px;

            color: #d9c18b;

            font-size: 11px;

            letter-spacing: 0.38em;

            text-transform: uppercase;
        }


        h1 {
            margin: 0;

            font-size:
                clamp(
                    52px,
                    9vw,
                    105px
                );

            font-weight: normal;

            line-height: 0.95;

            letter-spacing: 0.025em;

            text-shadow:
                0 12px 35px
                rgba(0,0,0,0.38);
        }


        .subtitle {
            margin:
                24px auto 0;

            max-width: 600px;

            color: #c5bec9;

            font-size:
                clamp(
                    15px,
                    2vw,
                    19px
                );

            line-height: 1.7;
        }


        .divider {
            width: 90px;
            height: 1px;

            margin:
                31px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d8bd82,
                    transparent
                );
        }


        /* ===============================================
           ENTER BUTTON
        =============================================== */

        .enter-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 220px;

            padding:
                15px 28px;

            border:
                1px solid
                rgba(222, 197, 141, 0.52);

            border-radius: 12px;

            color: #171717;

            background:
                linear-gradient(
                    135deg,
                    #ead9ae,
                    #c8ae78
                );

            font-family: inherit;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 0.16em;

            text-decoration: none;

            text-transform: uppercase;

            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.30);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .enter-button:hover {
            transform:
                translateY(-3px);

            box-shadow:
                0 17px 40px
                rgba(0,0,0,0.40);
        }


        .discover {
            margin-top: 25px;

            color: #8f8997;

            font-size: 10px;

            letter-spacing: 0.18em;

            text-transform: uppercase;
        }


        /* ===============================================
           DECORATION
        =============================================== */

        .sigil {
            margin-bottom: 24px;

            color: #d9c18b;

            font-size: 30px;

            opacity: 0.85;
        }


        .corner {
            position: fixed;

            width: 70px;
            height: 70px;

            opacity: 0.24;

            pointer-events: none;
        }


        .corner.top-left {
            top: 25px;
            left: 25px;

            border-top:
                1px solid #d8bd82;

            border-left:
                1px solid #d8bd82;
        }


        .corner.bottom-right {
            right: 25px;
            bottom: 25px;

            border-right:
                1px solid #d8bd82;

            border-bottom:
                1px solid #d8bd82;
        }


        /* ===============================================
           MOBILE
        =============================================== */

        @media (
            max-width: 600px
        ) {

            .landing {
                padding:
                    45px 20px;
            }

            .moon {
                width: 220px;
                height: 220px;
            }

            .subtitle {
                line-height: 1.55;
            }

        }

    </style>

</head>


<body>


    <div
        class="world-background"
        aria-hidden="true"
    >

        <div class="moon"></div>

        <div class="mist"></div>

    </div>


    <div
        class="corner top-left"
        aria-hidden="true"
    ></div>

    <div
        class="corner bottom-right"
        aria-hidden="true"
    ></div>


    <main class="landing">


        <div class="sigil">
            ✦
        </div>


        <div class="eyebrow">
            A Living Modern Fantasy World
        </div>


        <h1>
            Everwyn
        </h1>


        <p class="subtitle">

            Beyond the familiar lies a world
            shaped by magic, ambition,
            friendship, mystery, and the lives
            of those who call it home.

        </p>


        <div class="divider"></div>


        <a
            class="enter-button"
            href="login.html"
        >
            Enter Everwyn
        </a>


        <div class="discover">
            Your story begins here
        </div>


    </main>


</body>

</html>
