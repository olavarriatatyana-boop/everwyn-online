<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Everwyn Online - Activity</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #17142d,
                    #29204a,
                    #1b3550
                );

            color: white;

            min-height: 100vh;

        }


        .page {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding: 30px 20px 60px;

        }


        .back-link {

            display: inline-block;

            margin-bottom: 20px;

            color: #d9c7ff;

            text-decoration: none;

            font-weight: bold;

        }


        .back-link:hover {

            text-decoration: underline;

        }


        .card {

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);

            backdrop-filter:
                blur(10px);

        }


        h1 {

            margin-top: 0;

            margin-bottom: 8px;

            font-size: 36px;

        }


        h2 {

            margin-top: 35px;

            margin-bottom: 15px;

        }


        .description {

            color: #ddd5ed;

            line-height: 1.6;

        }


        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 15px;

            margin-top: 25px;

        }


        .info-box {

            background:
                rgba(255, 255, 255, 0.06);

            border-radius: 15px;

            padding: 18px;

        }


        .info-label {

            color: #aaa0c5;

            font-size: 13px;

            margin-bottom: 6px;

        }


        .info-value {

            font-size: 18px;

            font-weight: bold;

        }


        .players {

            margin-top: 20px;

        }


        .player {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 15px;

            margin-bottom: 10px;

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.06);

        }


        .player-name {

            font-weight: bold;

        }


        .player-status {

            font-size: 13px;

            color: #aaa0c5;

        }


        button {

            border: none;

            border-radius: 12px;

            padding: 14px 22px;

            margin-top: 20px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background: #d9b8ff;

            color: #21152f;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;

        }


        button:hover {

            transform:
                translateY(-1px);

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }


        #leave-button {

            background: #f2b8c6;

        }


        .status {

            margin-top: 20px;

            padding: 15px;

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.06);

            color: #ddd5ed;

            line-height: 1.5;

        }


        .loading {

            color: #cfc5df;

        }


        .error {

            color: #ffb8c4;

        }

    </style>

</head>


<body>

    <div class="page">

        <a
            class="back-link"
            href="javascript:history.back()"
        >
            ← Back
        </a>


        <div class="card">

            <div id="activity-content">

                <p class="loading">
                    Loading activity...
                </p>

            </div>


            <div
                id="activity-status"
                class="status"
            >

                <p>
                    This activity is available to join.
                </p>

            </div>


            <button
                id="join-button"
                type="button"
                onclick="joinActivity()"
            >

                Join Activity

            </button>


            <button
                id="leave-button"
                type="button"
                onclick="leaveActivity()"
                style="display: none;"
            >

                Leave Activity

            </button>

        </div>

    </div>


    <script>

        /*
            EVERWYN SUPABASE CONNECTION
        */

        const SUPABASE_URL =
            "https://iajvwhrjutqkqqvbknth.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_5zhAgTZggC_EnEc0o834_g_8h9yudIz";


        /*
            CURRENT EVERWYN PLAYER

            Yanola = player ID 3
        */

        const CURRENT_PLAYER_ID =
            3;


        let currentActivity =
            null;


        let currentLocation =
            null;


        const activityContent =
            document.getElementById(
                "activity-content"
            );


        const activityStatus =
            document.getElementById(
                "activity-status"
            );


        const joinButton =
            document.getElementById(
                "join-button"
            );


        const leaveButton =
            document.getElementById(
                "leave-button"
            );


        /*
            HTML SAFETY HELPER
        */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /*
            GET ACTIVITY ID FROM URL
        */

        function getActivityId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            return params.get("id");

        }


        /*
            LOAD ACTIVITY
        */

        async function loadActivity() {

            const activityId =
                getActivityId();


            if (!activityId) {

                activityContent.innerHTML = `

                    <p class="error">
                        Activity ID is missing.
                    </p>

                `;

                joinButton.style.display =
                    "none";

                return;

            }


            try {

                const response =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/world_activities" +
                        "?id=eq." +
                        encodeURIComponent(
                            activityId
                        ) +
                        "&select=*" +
                        "&apikey=" +
                        encodeURIComponent(
                            SUPABASE_KEY
                        )

                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load activity. HTTP " +
                        response.status
                    );

                }


                const activities =
                    await response.json();


                if (!activities.length) {

                    throw new Error(
                        "Activity not found."
                    );

                }


                currentActivity =
                    activities[0];


                await loadLocation(
                    currentActivity.location_id
                );


                await loadParticipants(
                    currentActivity.id
                );


            } catch (error) {

                console.error(
                    "Everwyn activity load error:",
                    error
                );


                activityContent.innerHTML = `

                    <p class="error">

                        <strong>
                            Unable to load activity.
                        </strong>

                    </p>

                    <p>
                        ${escapeHtml(
                            error.message
                        )}
                    </p>

                `;


                joinButton.style.display =
                    "none";

            }

        }


        /*
            LOAD LOCATION
        */

        async function loadLocation(
            locationId
        ) {

            if (!locationId) {

                return;

            }


            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/world_locations" +
                    "?id=eq." +
                    encodeURIComponent(
                        locationId
                    ) +
                    "&select=*" +
                    "&apikey=" +
                    encodeURIComponent(
                        SUPABASE_KEY
                    )

                );


            if (!response.ok) {

                return;

            }


            const locations =
                await response.json();


            if (locations.length) {

                currentLocation =
                    locations[0];

            }

        }


        /*
            LOAD PARTICIPANTS
        */

        async function loadParticipants(
            activityId
        ) {

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/activity_participants" +
                    "?activity_id=eq." +
                    encodeURIComponent(
                        activityId
                    ) +
                    "&participation_status=eq.active" +
                    "&select=*" +
                    "&apikey=" +
                    encodeURIComponent(
                        SUPABASE_KEY
                    )

                );


            if (!response.ok) {

                throw new Error(
                    "Could not load participants. HTTP " +
                    response.status
                );

            }


            const participants =
                await response.json();


            const maximumPlayers =
                Number(
                    currentActivity.maximum_players
                );


            const minimumPlayers =
                Number(
                    currentActivity.minimum_players
                );


            activityContent.innerHTML = `

                <h1>
                    ${escapeHtml(
                        currentActivity.name
                    )}
                </h1>


                <p class="description">

                    ${escapeHtml(
                        currentActivity.description
                    )}

                </p>


                <div class="info-grid">

                    <div class="info-box">

                        <div class="info-label">
                            Location
                        </div>

                        <div class="info-value">

                            ${escapeHtml(
                                currentLocation
                                    ? currentLocation.name
                                    : "Everwyn"
                            )}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Players
                        </div>

                        <div class="info-value">

                            ${participants.length}
                            /
                            ${maximumPlayers}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Minimum Players
                        </div>

                        <div class="info-value">

                            ${minimumPlayers}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Reward
                        </div>

                        <div class="info-value">

                            ${escapeHtml(
                                currentActivity.reward_amount
                            )}
                            ${escapeHtml(
                                currentActivity.reward_type
                            )}

                        </div>

                    </div>

                </div>


                <h2>
                    Players in Activity
                </h2>


                <div class="players">

                    ${
                        participants.length
                        ?
                        participants.map(
                            participant => `

                                <div class="player">

                                    <div>

                                        <div class="player-name">

                                            ${
                                                Number(
                                                    participant.player_id
                                                ) ===
                                                CURRENT_PLAYER_ID
                                                ?
                                                "Yanola"
                                                :
                                                "Player"
                                            }

                                        </div>


                                        <div class="player-status">

                                            ${
                                                escapeHtml(
                                                    participant.role ||
                                                    "Participant"
                                                )
                                            }

                                        </div>

                                    </div>


                                    <div class="player-status">

                                        Active

                                    </div>

                                </div>

                            `
                        ).join("")
                        :
                        `

                            <p>
                                No players have joined yet.
                            </p>

                        `
                    }

                </div>

            `;


            /*
                CHECK CURRENT PLAYER'S RECORD
            */

            const playerResponse =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/activity_participants" +
                    "?activity_id=eq." +
                    encodeURIComponent(
                        activityId
                    ) +
                    "&player_id=eq." +
                    encodeURIComponent(
                        CURRENT_PLAYER_ID
                    ) +
                    "&select=*" +
                    "&apikey=" +
                    encodeURIComponent(
                        SUPABASE_KEY
                    )

                );


            if (!playerResponse.ok) {

                throw new Error(
                    "Could not check player participation. HTTP " +
                    playerResponse.status
                );

            }


            const playerRecords =
                await playerResponse.json();


            const playerRecord =
                playerRecords.length
                ?
                playerRecords[0]
                :
                null;


            if (
                playerRecord &&
                playerRecord.participation_status ===
                "active"
            ) {

                joinButton.style.display =
                    "none";

                leaveButton.style.display =
                    "inline-block";


                activityStatus.innerHTML = `

                    <p>

                        <strong>
                            Yanola is participating.
                        </strong>

                    </p>

                    <p>
                        You are currently in this activity.
                    </p>

                `;

            } else {

                joinButton.style.display =
                    "inline-block";

                leaveButton.style.display =
                    "none";


                if (
                    participants.length >=
                    maximumPlayers
                ) {

                    joinButton.disabled =
                        true;

                    activityStatus.innerHTML = `

                        <p>

                            <strong>
                                This activity is full.
                            </strong>

                        </p>

                        <p>
                            ${maximumPlayers}
                            players are currently allowed.
                        </p>

                    `;

                } else {

                    joinButton.disabled =
                        false;

                    activityStatus.innerHTML = `

                        <p>
                            This activity is available to join.
                        </p>

                    `;

                }

            }

        }


        /*
            JOIN ACTIVITY
        */

        async function joinActivity() {

            if (!currentActivity) {

                return;

            }


            joinButton.disabled =
                true;


            joinButton.textContent =
                "Joining...";


            activityStatus.innerHTML = `

                <p>
                    Checking activity availability...
                </p>

            `;


            try {

                /*
                    CHECK WHETHER YANOLA ALREADY
                    HAS A PARTICIPATION RECORD
                */

                const checkResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/activity_participants" +
                        "?activity_id=eq." +
                        encodeURIComponent(
                            currentActivity.id
                        ) +
                        "&player_id=eq." +
                        encodeURIComponent(
                            CURRENT_PLAYER_ID
                        ) +
                        "&select=*" +
                        "&apikey=" +
                        encodeURIComponent(
                            SUPABASE_KEY
                        )

                    );


                if (!checkResponse.ok) {

                    throw new Error(
                        "Could not check participation. HTTP " +
                        checkResponse.status
                    );

                }


                const existing =
                    await checkResponse.json();


                /*
                    IF YANOLA IS ALREADY ACTIVE,
                    DO NOT CREATE ANOTHER RECORD
                */

                if (
                    existing.length &&
                    existing[0]
                        .participation_status ===
                    "active"
                ) {

                    await loadParticipants(
                        currentActivity.id
                    );

                    return;

                }


                /*
                    CHECK CURRENT ACTIVE PLAYER COUNT
                */

                const participantsResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/activity_participants" +
                        "?activity_id=eq." +
                        encodeURIComponent(
                            currentActivity.id
                        ) +
                        "&participation_status=eq.active" +
                        "&select=id" +
                        "&apikey=" +
                        encodeURIComponent(
                            SUPABASE_KEY
                        )

                    );


                if (!participantsResponse.ok) {

                    throw new Error(
                        "Could not check activity capacity. HTTP " +
                        participantsResponse.status
                    );

                }


                const activeParticipants =
                    await participantsResponse.json();


                const maximumPlayers =
                    Number(
                        currentActivity.maximum_players
                    );


                /*
                    STOP JOINING IF THE ACTIVITY
                    IS ALREADY FULL
                */

                if (
                    activeParticipants.length >=
                    maximumPlayers
                ) {

                    activityStatus.innerHTML = `

                        <p>

                            <strong>
                                This activity is full.
                            </strong>

                        </p>

                        <p>
                            ${maximumPlayers}
                            players are currently allowed.
                        </p>

                    `;


                    joinButton.disabled =
                        false;

                    joinButton.textContent =
                        "Join Activity";


                    return;

                }


                /*
                    REACTIVATE A PREVIOUS
                    PARTICIPATION RECORD
                */

                if (existing.length) {

                    const updateResponse =
                        await fetch(

                            SUPABASE_URL +
                            "/rest/v1/activity_participants" +
                            "?id=eq." +
                            encodeURIComponent(
                                existing[0].id
                            ),

                            {

                                method: "PATCH",

                                headers: {

                                    "apikey":
                                        SUPABASE_KEY,

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        participation_status:
                                            "active",

                                        left_at:
                                            null

                                    })

                            }

                        );


                    if (!updateResponse.ok) {

                        const errorText =
                            await updateResponse.text();


                        throw new Error(
                            "Could not rejoin activity. HTTP " +
                            updateResponse.status +
                            " - " +
                            errorText
                        );

                    }


                } else {

                    /*
                        CREATE NEW PARTICIPATION
                    */

                    const insertResponse =
                        await fetch(

                            SUPABASE_URL +
                            "/rest/v1/activity_participants",

                            {

                                method: "POST",

                                headers: {

                                    "apikey":
                                        SUPABASE_KEY,

                                    "Content-Type":
                                        "application/json",

                                    "Prefer":
                                        "return=representation"

                                },

                                body:
                                    JSON.stringify({

                                        activity_id:
                                            currentActivity.id,

                                        player_id:
                                            CURRENT_PLAYER_ID,

                                        participation_status:
                                            "active",

                                        role:
                                            "Participant",

                                        contribution_score:
                                            0,

                                        reward_claimed:
                                            false,

                                        session_data:
                                            {}

                                    })

                            }

                        );


                    if (!insertResponse.ok) {

                        const errorText =
                            await insertResponse.text();


                        throw new Error(
                            "Could not join activity. HTTP " +
                            insertResponse.status +
                            " - " +
                            errorText
                        );

                    }

                }


                await loadParticipants(
                    currentActivity.id
                );


            } catch (error) {

                console.error(
                    "Everwyn activity join error:",
                    error
                );


                activityStatus.innerHTML = `

                    <p>

                        <strong>
                            Unable to join the activity.
                        </strong>

                    </p>


                    <p>

                        ${escapeHtml(
                            error.message
                        )}

                    </p>

                `;


                joinButton.disabled =
                    false;


                joinButton.textContent =
                    "Join Activity";

            }

        }


        /*
            LEAVE ACTIVITY
        */

        async function leaveActivity() {

            if (!currentActivity) {

                return;

            }


            leaveButton.disabled =
                true;


            leaveButton.textContent =
                "Leaving...";


            activityStatus.innerHTML = `

                <p>
                    Leaving the activity...
                </p>

            `;


            try {

                const response =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/activity_participants" +
                        "?activity_id=eq." +
                        encodeURIComponent(
                            currentActivity.id
                        ) +
                        "&player_id=eq." +
                        encodeURIComponent(
                            CURRENT_PLAYER_ID
                        ),

                        {

                            method: "PATCH",

                            headers: {

                                "apikey":
                                    SUPABASE_KEY,

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    participation_status:
                                        "left",

                                    left_at:
                                        new Date()
                                            .toISOString()

                                })

                        }

                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();


                    throw new Error(
                        "Could not leave activity. HTTP " +
                        response.status +
                        " - " +
                        errorText
                    );

                }


                activityStatus.innerHTML = `

                    <p>

                        <strong>

                            Yanola left
                            ${escapeHtml(
                                currentActivity.name
                            )}.

                        </strong>

                    </p>

                `;


                await loadParticipants(
                    currentActivity.id
                );


            } catch (error) {

                console.error(
                    "Everwyn activity leave error:",
                    error
                );


                activityStatus.innerHTML = `

                    <p>

                        <strong>
                            Unable to leave the activity.
                        </strong>

                    </p>


                    <p>

                        ${escapeHtml(
                            error.message
                        )}

                    </p>

                `;

            }


            leaveButton.disabled =
                false;


            leaveButton.textContent =
                "Leave Activity";

        }


        /*
            START PAGE
        */

        loadActivity();

    </script>

</body>

</html>
