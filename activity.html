<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Everwyn Online — Activity</title>


    <style>

        body {

            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background:
                linear-gradient(
                    135deg,
                    #f8f1ff,
                    #eef7ff,
                    #fff5f8
                );

            color: #30263d;

        }


        .page {

            max-width: 1000px;

            margin: 0 auto;

            padding: 40px 20px 60px;

        }


        .back-link {

            display: inline-block;

            margin-bottom: 20px;

            color: #7557a8;

            text-decoration: none;

            font-weight: bold;

        }


        .back-link:hover {

            text-decoration: underline;

        }


        .card {

            background: rgba(
                255,
                255,
                255,
                0.88
            );

            border-radius: 24px;

            padding: 32px;

            box-shadow:
                0 15px 40px
                rgba(
                    70,
                    45,
                    95,
                    0.12
                );

        }


        h1 {

            margin-top: 0;

            font-size: 38px;

        }


        h2 {

            margin-top: 35px;

            font-size: 24px;

        }


        .description {

            color: #665a72;

            line-height: 1.7;

            font-size: 17px;

        }


        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        180px,
                        1fr
                    )
                );

            gap: 15px;

            margin-top: 25px;

        }


        .info-box {

            padding: 18px;

            border-radius: 16px;

            background:
                #f8f4fc;

            border:
                1px solid
                #e7dcf2;

        }


        .info-label {

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 0.08em;

            color: #89779b;

            margin-bottom: 7px;

        }


        .info-value {

            font-size: 18px;

            font-weight: bold;

        }


        .players {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .player {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 16px 18px;

            border-radius: 16px;

            background:
                #faf8fd;

            border:
                1px solid
                #e8dff0;

        }


        .player-name {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .player-status {

            color: #786b84;

            font-size: 14px;

        }


        .actions {

            margin-top: 30px;

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

        }


        button {

            border: none;

            border-radius: 12px;

            padding:
                13px 22px;

            font-family: inherit;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        #joinButton {

            background:
                #8c68b8;

            color: white;

        }


        #joinButton:hover {

            background:
                #76549f;

        }


        #leaveButton {

            background:
                #e7dce9;

            color: #513d58;

        }


        #leaveButton:hover {

            background:
                #dacbdc;

        }


        button:disabled {

            opacity: 0.55;

            cursor: not-allowed;

        }


        #activityStatus {

            margin-top: 20px;

            padding: 16px;

            border-radius: 14px;

            background:
                #f5effa;

            color: #5c4c68;

        }


        @media (
            max-width: 600px
        ) {

            .page {

                padding:
                    25px 14px 40px;

            }


            .card {

                padding: 22px;

            }


            h1 {

                font-size: 30px;

            }


            .player {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }

        }

    </style>

</head>


<body>


    <div class="page">


        <a
            href="explore.html"
            class="back-link"
        >
            ← Back to Explore Everwyn
        </a>


        <div class="card">

            <div id="activityContent">

                <p>
                    Loading activity...
                </p>

            </div>


            <div class="actions">

                <button
                    id="joinButton"
                    onclick="joinActivity()"
                >
                    Join Activity
                </button>


                <button
                    id="leaveButton"
                    onclick="leaveActivity()"
                    style="display:none;"
                >
                    Leave Activity
                </button>

            </div>


            <div id="activityStatus">

                <p>
                    Loading activity status...
                </p>

            </div>

        </div>

    </div>


    <script>


        /*
            SUPABASE CONNECTION
        */

        const SUPABASE_URL =
            "https://iajvwhrjutqkqqvbknth.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_5zhAgTZggC_EnEc0o834_g_8h9yudIz";


        /*
            CURRENT EVERWYN PLAYER
        */

        const CURRENT_PLAYER_ID =
            3;


        /*
            PAGE ELEMENTS
        */

        const activityContent =
            document.getElementById(
                "activityContent"
            );


        const activityStatus =
            document.getElementById(
                "activityStatus"
            );


        const joinButton =
            document.getElementById(
                "joinButton"
            );


        const leaveButton =
            document.getElementById(
                "leaveButton"
            );


        /*
            CURRENT DATA
        */

        let currentActivity =
            null;


        let currentLocation =
            null;


        /*
            ESCAPE HTML
        */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /*
            GET ACTIVITY ID
        */

        function getActivityId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            return params.get(
                "id"
            );

        }


        /*
            LOAD ACTIVITY
        */

        async function loadActivity() {

            const activityId =
                getActivityId();


            if (!activityId) {

                activityContent.innerHTML = `

                    <h1>
                        Activity Not Found
                    </h1>

                    <p>
                        No activity was specified.
                    </p>

                `;

                return;

            }


            try {

                /*
                    LOAD ACTIVITY
                */

                const activityResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/world_activities" +
                        "?id=eq." +
                        encodeURIComponent(
                            activityId
                        ) +
                        "&select=*" +
                        "&apikey=" +
                        encodeURIComponent(
                            SUPABASE_KEY
                        )

                    );


                if (!activityResponse.ok) {

                    throw new Error(
                        "Could not load activity. HTTP " +
                        activityResponse.status
                    );

                }


                const activities =
                    await activityResponse.json();


                if (!activities.length) {

                    activityContent.innerHTML = `

                        <h1>
                            Activity Not Found
                        </h1>

                        <p>
                            This activity does not exist.
                        </p>

                    `;

                    return;

                }


                currentActivity =
                    activities[0];


                /*
                    LOAD LOCATION
                */

                await loadLocation(
                    currentActivity.location_id
                );


                /*
                    LOAD PARTICIPANTS
                */

                await loadParticipants(
                    currentActivity.id
                );


            } catch (error) {

                console.error(
                    "Everwyn activity loading error:",
                    error
                );


                activityContent.innerHTML = `

                    <h1>
                        Unable to Load Activity
                    </h1>

                    <p>

                        ${escapeHtml(
                            error.message
                        )}

                    </p>

                `;

            }

        }


        /*
            LOAD LOCATION
        */

        async function loadLocation(
            locationId
        ) {

            if (!locationId) {

                currentLocation =
                    null;

                return;

            }


            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/world_locations" +
                    "?id=eq." +
                    encodeURIComponent(
                        locationId
                    ) +
                    "&select=*" +
                    "&apikey=" +
                    encodeURIComponent(
                        SUPABASE_KEY
                    )

                );


            if (!response.ok) {

                throw new Error(
                    "Could not load location. HTTP " +
                    response.status
                );

            }


            const locations =
                await response.json();


            currentLocation =
                locations.length
                    ?
                    locations[0]
                    :
                    null;

        }


        /*
            LOAD PARTICIPANTS
        */

        async function loadParticipants(
            activityId
        ) {

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/activity_participants" +
                    "?activity_id=eq." +
                    encodeURIComponent(
                        activityId
                    ) +
                    "&participation_status=eq.active" +
                    "&select=*,players(id,name,current_status,profile_visibility,status_message)" +
                    "&apikey=" +
                    encodeURIComponent(
                        SUPABASE_KEY
                    )

                );


            if (!response.ok) {

                throw new Error(
                    "Could not load participants. HTTP " +
                    response.status
                );

            }


            const participants =
                await response.json();


            const maximumPlayers =
                Number(
                    currentActivity.maximum_players
                );


            const minimumPlayers =
                Number(
                    currentActivity.minimum_players
                );


            activityContent.innerHTML = `

                <h1>
                    ${escapeHtml(
                        currentActivity.name
                    )}
                </h1>


                <p class="description">

                    ${escapeHtml(
                        currentActivity.description
                    )}

                </p>


                <div class="info-grid">

                    <div class="info-box">

                        <div class="info-label">
                            Location
                        </div>

                        <div class="info-value">

                            ${escapeHtml(
                                currentLocation
                                    ?
                                    currentLocation.name
                                    :
                                    "Everwyn"
                            )}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Players
                        </div>

                        <div class="info-value">

                            ${participants.length}
                            /
                            ${maximumPlayers}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Minimum Players
                        </div>

                        <div class="info-value">

                            ${minimumPlayers}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Reward
                        </div>

                        <div class="info-value">

                            ${escapeHtml(
                                String(
                                    currentActivity.reward_amount
                                )
                            )}

                            ${escapeHtml(
                                currentActivity.reward_type
                            )}

                        </div>

                    </div>

                </div>


                <h2>
                    Players in Activity
                </h2>


                <div class="players">

                    ${
                        participants.length

                        ?

                        participants.map(
                            participant => {

                                const player =
                                    participant.players;


                                const playerName =
                                    player &&
                                    player.name
                                        ?
                                        player.name
                                        :
                                        "Unknown Player";


                                const playerStatus =
                                    player &&
                                    player.current_status
                                        ?
                                        player.current_status
                                        :
                                        "offline";


                                const isCurrentPlayer =
                                    Number(
                                        participant.player_id
                                    ) ===
                                    CURRENT_PLAYER_ID;


                                return `

                                    <div class="player">

                                        <div>

                                            <div class="player-name">

                                                ${escapeHtml(
                                                    playerName
                                                )}

                                                ${
                                                    isCurrentPlayer
                                                        ?
                                                        " (You)"
                                                        :
                                                        ""
                                                }

                                            </div>


                                            <div class="player-status">

                                                ${escapeHtml(
                                                    participant.role ||
                                                    "Participant"
                                                )}

                                            </div>

                                        </div>


                                        <div class="player-status">

                                            ${escapeHtml(
                                                playerStatus
                                            )}

                                        </div>

                                    </div>

                                `;

                            }

                        ).join("")

                        :

                        `

                            <p>
                                No players have joined yet.
                            </p>

                        `

                    }

                </div>

            `;


            /*
                CHECK CURRENT PLAYER'S RECORD
            */

            const playerResponse =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/activity_participants" +
                    "?activity_id=eq." +
                    encodeURIComponent(
                        activityId
                    ) +
                    "&player_id=eq." +
                    encodeURIComponent(
                        CURRENT_PLAYER_ID
                    ) +
                    "&select=*" +
                    "&apikey=" +
                    encodeURIComponent(
                        SUPABASE_KEY
                    )

                );


            if (!playerResponse.ok) {

                throw new Error(
                    "Could not check player participation. HTTP " +
                    playerResponse.status
                );

            }


            const playerRecords =
                await playerResponse.json();


            const playerRecord =
                playerRecords.length
                    ?
                    playerRecords[0]
                    :
                    null;


            if (
                playerRecord &&
                playerRecord.participation_status ===
                "active"
            ) {

                joinButton.style.display =
                    "none";

                leaveButton.style.display =
                    "inline-block";


                activityStatus.innerHTML = `

                    <p>

                        <strong>
                            Yanola is participating.
                        </strong>

                    </p>

                    <p>
                        You are currently in this activity.
                    </p>

                `;

            } else {

                joinButton.style.display =
                    "inline-block";

                leaveButton.style.display =
                    "none";


                if (
                    participants.length >=
                    maximumPlayers
                ) {

                    joinButton.disabled =
                        true;


                    activityStatus.innerHTML = `

                        <p>

                            <strong>
                                This activity is full.
                            </strong>

                        </p>

                        <p>
                            ${maximumPlayers}
                            players are currently allowed.
                        </p>

                    `;

                } else {

                    joinButton.disabled =
                        false;


                    activityStatus.innerHTML = `

                        <p>
                            This activity is available to join.
                        </p>

                    `;

                }

            }

        }


        /*
            JOIN ACTIVITY
        */

        async function joinActivity() {

            if (!currentActivity) {

                return;

            }


            joinButton.disabled =
                true;


            joinButton.textContent =
                "Joining...";


            activityStatus.innerHTML = `

                <p>
                    Checking activity availability...
                </p>

            `;


            try {

                /*
                    CHECK WHETHER YANOLA ALREADY
                    HAS A PARTICIPATION RECORD
                */

                const checkResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/activity_participants" +
                        "?activity_id=eq." +
                        encodeURIComponent(
                            currentActivity.id
                        ) +
                        "&player_id=eq." +
                        encodeURIComponent(
                            CURRENT_PLAYER_ID
                        ) +
                        "&select=*" +
                        "&apikey=" +
                        encodeURIComponent(
                            SUPABASE_KEY
                        )

                    );


                if (!checkResponse.ok) {

                    throw new Error(
                        "Could not check participation. HTTP " +
                        checkResponse.status
                    );

                }


                const existing =
                    await checkResponse.json();


                /*
                    IF YANOLA IS ALREADY ACTIVE,
                    DO NOT CREATE ANOTHER RECORD
                */

                if (
                    existing.length &&
                    existing[0].participation_status ===
                    "active"
                ) {

                    await loadParticipants(
                        currentActivity.id
                    );

                    return;

                }


                /*
                    CHECK CURRENT ACTIVE PLAYER COUNT
                */

                const participantsResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/activity_participants" +
                        "?activity_id=eq." +
                        encodeURIComponent(
                            currentActivity.id
                        ) +
                        "&participation_status=eq.active" +
                        "&select=id" +
                        "&apikey=" +
                        encodeURIComponent(
                            SUPABASE_KEY
                        )

                    );


                if (!participantsResponse.ok) {

                    throw new Error(
                        "Could not check activity capacity. HTTP " +
                        participantsResponse.status
                    );

                }


                const activeParticipants =
                    await participantsResponse.json();


                const maximumPlayers =
                    Number(
                        currentActivity.maximum_players
                    );


                /*
                    STOP JOINING IF THE ACTIVITY
                    IS ALREADY FULL
                */

                if (
                    activeParticipants.length >=
                    maximumPlayers
                ) {

                    activityStatus.innerHTML = `

                        <p>

                            <strong>
                                This activity is full.
                            </strong>

                        </p>

                        <p>
                            ${maximumPlayers}
                            players are currently allowed.
                        </p>

                    `;


                    joinButton.disabled =
                        false;


                    joinButton.textContent =
                        "Join Activity";


                    return;

                }


                /*
                    REACTIVATE A PREVIOUS
                    PARTICIPATION RECORD
                */

                if (existing.length) {

                    const updateResponse =
                        await fetch(

                            SUPABASE_URL +
                            "/rest/v1/activity_participants" +
                            "?id=eq." +
                            encodeURIComponent(
                                existing[0].id
                            ),

                            {

                                method:
                                    "PATCH",

                                headers: {

                                    "apikey":
                                        SUPABASE_KEY,

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        participation_status:
                                            "active",

                                        left_at:
                                            null

                                    })

                            }

                        );


                    if (!updateResponse.ok) {

                        const errorText =
                            await updateResponse.text();


                        throw new Error(
                            "Could not rejoin activity. HTTP " +
                            updateResponse.status +
                            " - " +
                            errorText
                        );

                    }

                } else {

                    /*
                        CREATE NEW PARTICIPATION
                    */

                    const insertResponse =
                        await fetch(

                            SUPABASE_URL +
                            "/rest/v1/activity_participants",

                            {

                                method:
                                    "POST",

                                headers: {

                                    "apikey":
                                        SUPABASE_KEY,

                                    "Content-Type":
                                        "application/json",

                                    "Prefer":
                                        "return=representation"

                                },

                                body:
                                    JSON.stringify({

                                        activity_id:
                                            currentActivity.id,

                                        player_id:
                                            CURRENT_PLAYER_ID,

                                        participation_status:
                                            "active",

                                        role:
                                            "Participant",

                                        contribution_score:
                                            0,

                                        reward_claimed:
                                            false,

                                        session_data:
                                            {}

                                    })

                            }

                        );


                    if (!insertResponse.ok) {

                        const errorText =
                            await insertResponse.text();


                        throw new Error(
                            "Could not join activity. HTTP " +
                            insertResponse.status +
                            " - " +
                            errorText
                        );

                    }

                }


                await loadParticipants(
                    currentActivity.id
                );


            } catch (error) {

                console.error(
                    "Everwyn activity join error:",
                    error
                );


                activityStatus.innerHTML = `

                    <p>

                        <strong>
                            Unable to join the activity.
                        </strong>

                    </p>


                    <p>

                        ${escapeHtml(
                            error.message
                        )}

                    </p>

                `;


                joinButton.disabled =
                    false;


                joinButton.textContent =
                    "Join Activity";

            }

        }


        /*
            LEAVE ACTIVITY
        */

        async function leaveActivity() {

            if (!currentActivity) {

                return;

            }


            leaveButton.disabled =
                true;


            leaveButton.textContent =
                "Leaving...";


            activityStatus.innerHTML = `

                <p>
                    Leaving the activity...
                </p>

            `;


            try {

                const response =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/activity_participants" +
                        "?activity_id=eq." +
                        encodeURIComponent(
                            currentActivity.id
                        ) +
                        "&player_id=eq." +
                        encodeURIComponent(
                            CURRENT_PLAYER_ID
                        ),

                        {

                            method:
                                "PATCH",

                            headers: {

                                "apikey":
                                    SUPABASE_KEY,

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    participation_status:
                                        "left",

                                    left_at:
                                        new Date()
                                            .toISOString()

                                })

                        }

                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();


                    throw new Error(
                        "Could not leave activity. HTTP " +
                        response.status +
                        " - " +
                        errorText
                    );

                }


                activityStatus.innerHTML = `

                    <p>

                        <strong>

                            Yanola left
                            ${escapeHtml(
                                currentActivity.name
                            )}.

                        </strong>

                    </p>

                `;


                await loadParticipants(
                    currentActivity.id
                );


            } catch (error) {

                console.error(
                    "Everwyn activity leave error:",
                    error
                );


                activityStatus.innerHTML = `

                    <p>

                        <strong>
                            Unable to leave the activity.
                        </strong>

                    </p>


                    <p>

                        ${escapeHtml(
                            error.message
                        )}

                    </p>

                `;

            }


            leaveButton.disabled =
                false;


            leaveButton.textContent =
                "Leave Activity";

        }


        /*
            START PAGE
        */

        loadActivity();

    </script>

</body>

</html>
