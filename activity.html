<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Activity | Everwyn Online</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="activity-name">Loading activity...</h1>
        <p id="activity-description"></p>
    </header>

    <main>

        <section>

            <h2>Activity Details</h2>

            <div id="activity-info">
                <p>Discovering activity information...</p>
            </div>

        </section>


        <section>

            <h2>Players</h2>

            <div id="participants">

                <p>
                    Checking who is participating...
                </p>

            </div>

        </section>


        <section>

            <h2>Activity Status</h2>

            <div id="activity-status">

                <p>
                    This activity is available to join.
                </p>

            </div>

            <button
                id="join-button"
                type="button"
                onclick="joinActivity()">

                Join Activity

            </button>

        </section>


        <section>

            <a id="back-to-location" href="explore.html">

                ← Back to Location

            </a>

        </section>

    </main>


    <script>

        const SUPABASE_URL =
            "https://iajvwhrjutqkqqvbknth.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_5zhAgTZggC_EnEc0o834_g_8h9yudIz";


        /*
            CURRENT EVERWYN PLAYER

            Yanola's existing player record.
        */

        const CURRENT_PLAYER_ID = 3;


        const activityName =
            document.getElementById("activity-name");

        const activityDescription =
            document.getElementById("activity-description");

        const activityInfo =
            document.getElementById("activity-info");

        const participantsContainer =
            document.getElementById("participants");

        const activityStatus =
            document.getElementById("activity-status");

        const joinButton =
            document.getElementById("join-button");

        const backToLocation =
            document.getElementById("back-to-location");


        let currentActivity = null;


        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        async function loadActivity() {

            try {

                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );


                const activityId =
                    urlParams.get("id");


                if (!activityId) {

                    activityName.textContent =
                        "Activity Not Found";

                    activityDescription.textContent =
                        "No activity was selected.";

                    activityInfo.innerHTML =
                        "<p>Please return to the previous location and choose an activity.</p>";

                    joinButton.style.display =
                        "none";

                    return;

                }


                /*
                    LOAD ACTIVITY
                */

                const activityResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/world_activities" +
                        "?id=eq." +
                        encodeURIComponent(activityId) +
                        "&is_available=eq.true" +
                        "&apikey=" +
                        encodeURIComponent(SUPABASE_KEY)

                    );


                if (!activityResponse.ok) {

                    throw new Error(
                        "Could not load activity. HTTP " +
                        activityResponse.status
                    );

                }


                const activities =
                    await activityResponse.json();


                if (!activities.length) {

                    activityName.textContent =
                        "Activity Not Found";

                    activityDescription.textContent =
                        "This activity is not currently available.";

                    activityInfo.innerHTML =
                        "<p>This activity could not be found.</p>";

                    joinButton.style.display =
                        "none";

                    return;

                }


                currentActivity =
                    activities[0];


                const activity =
                    currentActivity;


                document.title =
                    activity.name +
                    " | Everwyn Online";


                activityName.textContent =
                    activity.name;


                activityDescription.textContent =
                    activity.description ||
                    "An activity waiting to be discovered.";


                activityInfo.innerHTML = `

                    <p>
                        <strong>Type:</strong>
                        ${escapeHtml(
                            activity.activity_type ||
                            "Unknown"
                        )}
                    </p>

                    <p>
                        <strong>Players:</strong>
                        ${escapeHtml(
                            activity.minimum_players ??
                            1
                        )}
                        -
                        ${escapeHtml(
                            activity.maximum_players ??
                            1
                        )}
                    </p>

                    <p>
                        <strong>Reward:</strong>
                        ${escapeHtml(
                            activity.reward_amount ??
                            0
                        )}
                        ${escapeHtml(
                            activity.reward_type ||
                            ""
                        )}
                    </p>

                `;


                /*
                    LOAD LOCATION
                */

                if (activity.location_id) {

                    const locationResponse =
                        await fetch(

                            SUPABASE_URL +
                            "/rest/v1/world_locations" +
                            "?id=eq." +
                            encodeURIComponent(
                                activity.location_id
                            ) +
                            "&apikey=" +
                            encodeURIComponent(
                                SUPABASE_KEY
                            )

                        );


                    if (locationResponse.ok) {

                        const locations =
                            await locationResponse.json();


                        if (locations.length) {

                            const location =
                                locations[0];


                            backToLocation.href =
                                "location.html?id=" +
                                encodeURIComponent(
                                    location.id
                                );

                        }

                    }

                }


                /*
                    LOAD PARTICIPANTS
                */

                await loadParticipants(
                    activity.id
                );


            } catch (error) {

                console.error(
                    "Everwyn activity loading error:",
                    error
                );


                activityName.textContent =
                    "Everwyn could not load";


                activityDescription.textContent =
                    "Something went wrong while loading this activity.";


                activityInfo.innerHTML = `

                    <div class="error-message">

                        <h3>
                            Unable to load this activity.
                        </h3>

                        <p>
                            ${escapeHtml(
                                error.message
                            )}
                        </p>

                        <button
                            type="button"
                            onclick="loadActivity()">

                            Try Again

                        </button>

                    </div>

                `;


                joinButton.style.display =
                    "none";

            }

        }


        /*
            LOAD CURRENT PARTICIPANTS
        */

        async function loadParticipants(activityId) {

            try {

                const response =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/activity_participants" +
                        "?activity_id=eq." +
                        encodeURIComponent(activityId) +
                        "&participation_status=eq.active" +
                        "&order=joined_at.asc" +
                        "&apikey=" +
                        encodeURIComponent(SUPABASE_KEY)

                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load participants. HTTP " +
                        response.status
                    );

                }


                const participants =
                    await response.json();


                if (!participants.length) {

                    participantsContainer.innerHTML = `

                        <p>
                            No players have joined yet.
                        </p>

                    `;

                    return;

                }


                participantsContainer.innerHTML = "";


                participants.forEach(participant => {

                    const card =
                        document.createElement("article");


                    card.className =
                        "participant-card";


                    const isCurrentPlayer =
                        Number(
                            participant.player_id
                        ) === CURRENT_PLAYER_ID;


                    card.innerHTML = `

                        <h3>
                            ${
                                isCurrentPlayer
                                    ? "Yanola"
                                    : "Player " +
                                      escapeHtml(
                                          participant.player_id
                                      )
                            }
                        </h3>

                        <p>
                            ${
                                escapeHtml(
                                    participant.role ||
                                    "Participant"
                                )
                            }
                        </p>

                    `;


                    participantsContainer.appendChild(card);

                });


                const alreadyJoined =
                    participants.some(
                        participant =>
                            Number(
                                participant.player_id
                            ) === CURRENT_PLAYER_ID
                    );


                if (alreadyJoined) {

                    activityStatus.innerHTML = `

                        <p>
                            <strong>
                                Yanola is participating.
                            </strong>
                        </p>

                    `;

                    joinButton.disabled =
                        true;

                    joinButton.textContent =
                        "Joined";

                }

            } catch (error) {

                console.error(
                    "Everwyn participant loading error:",
                    error
                );


                participantsContainer.innerHTML = `

                    <p>
                        Participants could not be loaded.
                    </p>

                `;

            }

        }


        /*
            JOIN ACTIVITY
        */

        async function joinActivity() {

            if (!currentActivity) {

                return;

            }


            joinButton.disabled =
                true;


            joinButton.textContent =
                "Joining...";


            activityStatus.innerHTML = `

                <p>
                    Joining the activity...
                </p>

            `;


            try {

                /*
                    CHECK FOR EXISTING PARTICIPATION
                */

                const checkResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/activity_participants" +
                        "?activity_id=eq." +
                        encodeURIComponent(
                            currentActivity.id
                        ) +
                        "&player_id=eq." +
                        encodeURIComponent(
                            CURRENT_PLAYER_ID
                        ) +
                        "&apikey=" +
                        encodeURIComponent(
                            SUPABASE_KEY
                        )

                    );


                if (!checkResponse.ok) {

                    throw new Error(
                        "Could not check participation. HTTP " +
                        checkResponse.status
                    );

                }


                const existing =
                    await checkResponse.json();


                if (existing.length) {

                    activityStatus.innerHTML = `

                        <p>
                            <strong>
                                Yanola is already participating.
                            </strong>
                        </p>

                    `;

                    joinButton.textContent =
                        "Joined";


                    await loadParticipants(
                        currentActivity.id
                    );


                    return;

                }


                /*
                    CREATE PARTICIPATION
                */

                const insertResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/activity_participants",

                        {

                            method: "POST",

                            headers: {

                                "apikey":
                                    SUPABASE_KEY,

                                "Content-Type":
                                    "application/json",

                                "Prefer":
                                    "return=representation"

                            },

                            body: JSON.stringify({

                                activity_id:
                                    currentActivity.id,

                                player_id:
                                    CURRENT_PLAYER_ID,

                                participation_status:
                                    "active",

                                role:
                                    "Participant",

                                contribution_score:
                                    0,

                                reward_claimed:
                                    false,

                                session_data:
                                    {}

                            })

                        }

                    );


                if (!insertResponse.ok) {

                    const errorText =
                        await insertResponse.text();


                    throw new Error(
                        "Could not join activity. HTTP " +
                        insertResponse.status +
                        " - " +
                        errorText
                    );

                }


                activityStatus.innerHTML = `

                    <p>
                        <strong>
                            Yanola joined ${escapeHtml(
                                currentActivity.name
                            )}!
                        </strong>
                    </p>

                    <p>
                        Your participation has been saved.
                    </p>

                `;


                joinButton.textContent =
                    "Joined";


                await loadParticipants(
                    currentActivity.id
                );


            } catch (error) {

                console.error(
                    "Everwyn activity join error:",
                    error
                );


                activityStatus.innerHTML = `

                    <p>
                        <strong>
                            Unable to join the activity.
                        </strong>
                    </p>

                    <p>
                        ${escapeHtml(
                            error.message
                        )}
                    </p>

                `;


                joinButton.disabled =
                    false;


                joinButton.textContent =
                    "Join Activity";

            }

        }


        loadActivity();

    </script>

</body>
</html>
