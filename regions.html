<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Region | Everwyn Online</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="region-name">Loading Everwyn...</h1>
        <p id="region-description"></p>
    </header>

    <main>

        <section>
            <h2>Places to Explore</h2>

            <div id="locations">
                <p>Discovering places...</p>
            </div>

        </section>

        <section>
            <a href="explore.html">← Back to Regions</a>
        </section>

    </main>

    <script>
        const SUPABASE_URL =
            "https://iajvwhrjutqkqqvbknth.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_5zhAgTZggC_EnEc0o834_g_8h9yudIz";

        const regionName =
            document.getElementById("region-name");

        const regionDescription =
            document.getElementById("region-description");

        const locationsContainer =
            document.getElementById("locations");


        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;
        }


        async function loadRegion() {

            try {

                const urlParams =
                    new URLSearchParams(window.location.search);

                const regionId =
                    urlParams.get("id");


                if (!regionId) {

                    regionName.textContent =
                        "Region Not Found";

                    regionDescription.textContent =
                        "No region was selected.";

                    locationsContainer.innerHTML =
                        "<p>Please return to Explore Everwyn and choose a region.</p>";

                    return;
                }


                /*
                 * Load the selected region
                 */

                const regionResponse =
                    await fetch(
                        SUPABASE_URL +
                        "/rest/v1/world_regions" +
                        "?id=eq." +
                        encodeURIComponent(regionId) +
                        "&is_active=eq.true" +
                        "&is_unlocked=eq.true" +
                        "&apikey=" +
                        encodeURIComponent(SUPABASE_KEY)
                    );


                if (!regionResponse.ok) {

                    throw new Error(
                        "Could not load region. HTTP " +
                        regionResponse.status
                    );

                }


                const regions =
                    await regionResponse.json();


                if (!regions.length) {

                    regionName.textContent =
                        "Region Not Found";

                    regionDescription.textContent =
                        "This region is not currently available.";

                    locationsContainer.innerHTML =
                        "<p>This region could not be found.</p>";

                    return;
                }


                const region =
                    regions[0];


                document.title =
                    region.name +
                    " | Everwyn Online";


                regionName.textContent =
                    region.name;


                regionDescription.textContent =
                    region.description ||
                    "Explore this part of Everwyn.";


                /*
                 * Load locations inside this region
                 */

                locationsContainer.innerHTML =
                    "<p>Discovering places...</p>";


                const locationResponse =
                    await fetch(
                        SUPABASE_URL +
                        "/rest/v1/world_locations" +
                        "?region_id=eq." +
                        encodeURIComponent(regionId) +
                        "&order=id.asc" +
                        "&apikey=" +
                        encodeURIComponent(SUPABASE_KEY)
                    );


                if (!locationResponse.ok) {

                    throw new Error(
                        "Could not load locations. HTTP " +
                        locationResponse.status
                    );

                }


                const locations =
                    await locationResponse.json();


                if (!locations.length) {

                    locationsContainer.innerHTML = `
                        <p>
                            There aren't any discovered places here yet.
                        </p>
                    `;

                    return;
                }


                locationsContainer.innerHTML = "";


                locations.forEach(location => {

                    const card =
                        document.createElement("article");


                    card.className =
                        "location-card";


                    card.innerHTML = `

                        <h3>
                            ${escapeHtml(location.name)}
                        </h3>

                        <p>
                            ${escapeHtml(
                                location.description ||
                                "A place waiting to be explored."
                            )}
                        </p>

                        <p>
                            <strong>Type:</strong>
                            ${escapeHtml(
                                location.location_type ||
                                "Unknown"
                            )}
                        </p>

                        <button
                            type="button"
                            onclick="visitLocation(${location.id})"
                        >
                            Explore ${escapeHtml(location.name)}
                        </button>

                    `;


                    locationsContainer.appendChild(card);

                });


            } catch (error) {

                console.error(
                    "Everwyn region loading error:",
                    error
                );


                regionName.textContent =
                    "Everwyn could not load";


                regionDescription.textContent =
                    "Something went wrong while loading this region.";


                locationsContainer.innerHTML = `

                    <div class="error-message">

                        <h3>
                            Unable to load this region.
                        </h3>

                        <p>
                            ${escapeHtml(error.message)}
                        </p>

                        <button
                            type="button"
                            onclick="loadRegion()"
                        >
                            Try Again
                        </button>

                    </div>

                `;

            }

        }


        function visitLocation(locationId) {

            /*
             * Temporary navigation.
             *
             * Later this will open the actual
             * dynamic location/game system.
             */

            window.location.href =
                "location.html?id=" +
                encodeURIComponent(locationId);

        }


        loadRegion();

    </script>

</body>
</html>
