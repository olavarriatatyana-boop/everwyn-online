<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Home | Everwyn Online</title>

<style>
:root {
    --cream: #fff3dc;
    --gold: #e8c57a;
    --panel: rgba(18, 18, 30, 0.88);
    --panel-soft: rgba(25, 24, 40, 0.72);
    --border: rgba(255, 235, 194, 0.25);
    --lavender: #c7b7ff;
    --sage: #b8d6b0;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: #090b13;
    color: var(--cream);
}

button {
    font: inherit;
}

/* =========================
   LOADING
========================= */

#loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center, #273354, #0c101a 70%);
}

.loading-orb {
    width: 72px;
    height: 72px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #bbaeff 25%,
            #7398e8 58%,
            transparent 72%
        );

    box-shadow:
        0 0 55px rgba(171, 160, 255, 0.55);

    animation: pulse 1.8s infinite ease-in-out;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(.92);
        opacity: .8;
    }

    50% {
        transform: scale(1.07);
        opacity: 1;
    }
}

#loadingScreen h1 {
    margin: 22px 0 7px;
    font-family: Georgia, serif;
    font-weight: 500;
}

#loadingText {
    color: rgba(255,255,255,.7);
}

.hidden {
    display: none !important;
}

/* =========================
   ROOM
========================= */

.game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        #111 url("player-home-room.png")
        center center / cover no-repeat;
}

.game::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(7, 8, 18, .12),
            transparent 30%,
            transparent 68%,
            rgba(6, 7, 14, .28)
        );
}

/* =========================
   TOP HUD
========================= */

.top-hud {
    position: absolute;
    z-index: 20;
    top: 20px;
    left: 22px;
    right: 22px;

    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;

    pointer-events: none;
}

.player-card {
    display: flex;
    align-items: center;
    gap: 13px;

    min-width: 290px;

    padding: 10px 15px 10px 10px;

    border: 1px solid var(--border);
    border-radius: 22px;

    background: rgba(13, 13, 24, .76);
    backdrop-filter: blur(13px);

    box-shadow:
        0 12px 35px rgba(0,0,0,.3);

    pointer-events: auto;
}

.player-portrait {
    width: 64px;
    height: 64px;
    flex: 0 0 auto;

    display: grid;
    place-items: center;

    border-radius: 50%;

    border: 2px solid var(--gold);

    background:
        radial-gradient(
            circle,
            rgba(199,183,255,.75),
            rgba(92,72,137,.8)
        );

    overflow: hidden;

    font-size: 30px;
}

.player-portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.player-name {
    font-family: Georgia, serif;
    font-size: 1.25rem;
}

.player-meta {
    margin-top: 3px;
    color: rgba(255,255,255,.72);
    font-size: .82rem;
}

.xp-bar {
    width: 170px;
    height: 7px;

    margin-top: 8px;

    border-radius: 999px;
    overflow: hidden;

    background: rgba(255,255,255,.13);
}

.xp-fill {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #f5d995,
            #b7c8ff,
            #c9b5ff
        );
}

.hud-actions {
    display: flex;
    gap: 9px;
    pointer-events: auto;
}

.hud-button {
    min-width: 76px;

    padding: 10px 13px;

    border: 1px solid var(--border);
    border-radius: 17px;

    background: rgba(13, 13, 24, .76);
    backdrop-filter: blur(13px);

    color: white;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,.24);

    transition:
        transform .18s ease,
        background .18s ease;
}

.hud-button:hover {
    transform: translateY(-2px);
    background: rgba(34, 31, 53, .9);
}

.hud-icon {
    display: block;
    font-size: 1.25rem;
    margin-bottom: 3px;
}

.hud-label {
    font-size: .72rem;
    opacity: .82;
}

.wallet-button {
    min-width: 120px;
}

.wallet-amount {
    font-family: Georgia, serif;
    font-size: 1.1rem;
}

/* =========================
   CHARACTER
========================= */

.character-zone {
    position: absolute;
    z-index: 6;

    left: 50%;
    bottom: 12%;

    transform: translateX(-50%);

    width: min(28vw, 360px);
    height: min(68vh, 650px);

    display: flex;
    justify-content: center;
    align-items: flex-end;

    pointer-events: none;
}

.character-glow {
    position: absolute;
    bottom: 2%;

    width: 80%;
    height: 25%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(216,193,255,.28),
            transparent 70%
        );

    filter: blur(8px);
}

.character-placeholder {
    position: relative;
    z-index: 2;

    width: 170px;
    height: 330px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    border-radius: 48% 48% 35% 35%;

    background:
        linear-gradient(
            180deg,
            rgba(244,232,255,.15),
            rgba(113,91,154,.26)
        );

    border:
        1px solid rgba(255,255,255,.16);

    backdrop-filter: blur(3px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.22);

    color: rgba(255,255,255,.9);

    text-align: center;
}

.character-symbol {
    font-size: 4rem;
}

.character-placeholder span {
    margin-top: 10px;
    font-family: Georgia, serif;
    font-size: 1rem;
}

/* =========================
   HOTSPOTS
========================= */

.hotspot {
    position: absolute;
    z-index: 10;

    display: flex;
    align-items: center;
    gap: 9px;

    padding: 9px 14px 9px 9px;

    border:
        1px solid rgba(255, 226, 170, .45);

    border-radius: 999px;

    background:
        rgba(15, 14, 26, .78);

    backdrop-filter:
        blur(10px);

    color: white;

    cursor: pointer;

    box-shadow:
        0 8px 28px rgba(0,0,0,.32);

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.hotspot:hover {
    transform: scale(1.05);

    background:
        rgba(43, 36, 64, .93);

    box-shadow:
        0 0 30px rgba(230,202,142,.22);
}

.hotspot-icon {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        rgba(255,255,255,.08);

    color: var(--gold);

    font-size: 1.15rem;
}

.hotspot-label {
    font-weight: 700;
    font-size: .87rem;
}

/*
Room hotspot positions are percentages
so they move with the background.
*/

#wardrobeHotspot {
    left: 4%;
    top: 43%;
}

#inventoryHotspot {
    left: 22%;
    top: 58%;
}

#luminaHotspot {
    right: 25%;
    top: 42%;
}

#doorHotspot {
    right: 5%;
    top: 47%;
}

/* =========================
   BOTTOM NAVIGATION
========================= */

.bottom-nav {
    position: absolute;
    z-index: 20;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    display: flex;

    padding: 7px;

    border:
        1px solid var(--border);

    border-radius: 23px;

    background:
        rgba(13, 13, 24, .80);

    backdrop-filter:
        blur(16px);

    box-shadow:
        0 16px 45px rgba(0,0,0,.32);
}

.nav-button {
    min-width: 94px;

    padding: 8px 11px;

    border: 0;
    border-right:
        1px solid rgba(255,255,255,.08);

    background: transparent;

    color: rgba(255,255,255,.82);

    cursor: pointer;

    transition:
        color .18s ease,
        background .18s ease;
}

.nav-button:last-child {
    border-right: 0;
}

.nav-button:hover {
    color: white;
    background:
        rgba(255,255,255,.07);
}

.nav-icon {
    display: block;
    margin-bottom: 4px;
    font-size: 1.2rem;
}

.nav-label {
    font-size: .7rem;
}

/* =========================
   OVERLAY
========================= */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(5, 6, 13, .50);

    backdrop-filter:
        blur(8px);
}

.overlay.open {
    display: flex;
}

.panel {
    width: min(720px, 96vw);
    max-height: 82vh;

    overflow-y: auto;

    padding: 25px;

    border:
        1px solid var(--border);

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(24, 22, 40, .96),
            rgba(15, 16, 29, .97)
        );

    box-shadow:
        0 28px 90px rgba(0,0,0,.55);
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;

    padding-bottom: 15px;

    border-bottom:
        1px solid rgba(255,255,255,.09);
}

.panel-title {
    margin: 0;

    font-family: Georgia, serif;
    font-size: 1.8rem;
    font-weight: 500;
}

.close-panel {
    width: 40px;
    height: 40px;

    border:
        1px solid var(--border);

    border-radius: 50%;

    background:
        rgba(255,255,255,.06);

    color: white;

    cursor: pointer;

    font-size: 1.25rem;
}

.panel-body {
    padding-top: 18px;
}

.panel-card {
    margin-bottom: 11px;

    padding: 15px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 16px;

    background:
        rgba(255,255,255,.055);

    color: rgba(255,255,255,.76);

    line-height: 1.55;
}

.panel-card strong {
    color: white;
}

/* =========================
   LUMINA
========================= */

.lumina-device {
    width: min(480px, 94vw);

    padding: 14px;

    border-radius: 38px;

    background:
        linear-gradient(
            145deg,
            #36304d,
            #171522
        );

    border:
        2px solid rgba(230,207,255,.34);

    box-shadow:
        0 0 70px rgba(168,143,255,.28),
        0 30px 90px rgba(0,0,0,.55);
}

.lumina-screen {
    min-height: 580px;

    padding: 20px;

    border-radius: 28px;

    background:
        radial-gradient(
            circle at top,
            rgba(126,100,188,.32),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #18192b,
            #10111d
        );

    overflow: hidden;
}

.lumina-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 22px;
}

.lumina-title {
    font-family: Georgia, serif;
    font-size: 1.65rem;
}

.lumina-close {
    border: 0;
    background: transparent;
    color: white;
    font-size: 1.4rem;
    cursor: pointer;
}

.lumina-apps {
    display: grid;
    grid-template-columns:
        repeat(3, minmax(0,1fr));

    gap: 13px;
}

.lumina-app {
    min-height: 92px;

    padding: 12px 7px;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius: 19px;

    background:
        rgba(255,255,255,.055);

    color: white;

    cursor: pointer;

    transition:
        transform .18s ease,
        background .18s ease;
}

.lumina-app:hover {
    transform: translateY(-3px);

    background:
        rgba(255,255,255,.10);
}

.app-icon {
    display: block;
    font-size: 1.65rem;
    margin-bottom: 7px;
}

.app-name {
    font-size: .72rem;
}

.lumina-page {
    display: none;
}

.lumina-page.active {
    display: block;
}

.back-button {
    margin-bottom: 14px;

    border: 0;
    background: transparent;

    color: var(--lavender);

    cursor: pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    .game {
        background-position: center;
    }

    .player-card {
        min-width: 230px;
    }

    .hud-label {
        display: none;
    }

    .hud-button {
        min-width: 48px;
    }

    .bottom-nav {
        width: calc(100% - 20px);
        overflow-x: auto;
        justify-content: flex-start;
    }

    .nav-button {
        min-width: 82px;
    }

    .hotspot-label {
        display: none;
    }

    .hotspot {
        padding: 7px;
    }

    #wardrobeHotspot {
        left: 4%;
    }

    #inventoryHotspot {
        left: 20%;
    }

    #luminaHotspot {
        right: 20%;
    }

    #doorHotspot {
        right: 4%;
    }

    .character-zone {
        width: 220px;
    }
}

</style>
</head>

<body>

<div id="loadingScreen">

    <div class="loading-orb"></div>

    <h1>Entering Your Home</h1>

    <div id="loadingText">
        Awakening your Lumina...
    </div>

</div>


<main class="game" id="game">

    <!-- TOP HUD -->

    <div class="top-hud">

        <div class="player-card">

            <div
                class="player-portrait"
                id="playerPortrait"
            >
                ✧
            </div>

            <div>

                <div

                type="button"
            >

                <span

                    0
                </span>

                <span class="hud-label">
                    Lumen
                </span>
            </button>


            <button
                class="hud-button"
                id="notificationsButton"
                type="button"
            >
                <span class="hud-icon">🔔</span>

            </button>


            <button

    <!-- CHARACTER -->

    <div class="character-zone">

        <div

            <div class="character-symbol">
                ✧
            </div>

            <span id="characterLabel">

        </div>

    </div>


    <!-- ROOM OBJECTS -->

    <button
        class="hotspot"
        id="wardrobeHotspot"

    >
        <span class="hotspot-icon">
            ♙
        </span>

        <span class="hotspot-label">
            Wardrobe

    </button>


    <button

    <button

        type="button"
    >
        <span class="hotspot-icon">
            ⇥
        </span>

        <span class="hotspot-label">
            Leave Home

<!-- GENERAL PANEL -->

<div
    class="overlay"
    id="panelOverlay"
>

    <section class="panel">

        <div class="panel-header">

            <h2
                class="panel-title"
                id="panelTitle"
            >
                Everwyn
            </h2>

            <button
                class="close-panel"
                id="closePanel"

                ×
            </button>

        </div>

        <div

            id="panelBody"

</div>


<!-- LUMINA -->

<div
    class="overlay"

>

    <div class="lumina-device">

                <div class="lumina-title">

                </div>

                    class="lumina-close"

            >

                <div class="lumina-apps">

                    <button
                        class="lumina-app"

                    >
                        <span class="app-icon">✉</span>
                        <span class="app-name">Messages</span>
                    </button>


                    <button
                        class="lumina-app"
                        data-app="friends"
                    >
                        <span class="app-icon">♡</span>
                        <span class="app-name">Friends</span>
                    </button>


                    <button
                        class="lumina-app"
                        data-app="wallet"
                    >

                        data-app="bank"

                    <button

                    <button

                    </button>


                    <button

                        data-app="profile"

                        <span class="app-icon">☾</span>
                        <span class="app-name">Profile</span>
                    </button>


                    <button
                        class="lumina-app"
                        data-app="invites"
                    >

                </button>

                <div id="luminaAppContent"></div>

            </div>

        </div>

    </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://iajvwhrjutqkqqvbknth.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5zhAgTZggC_EnEc0o834_g_8h9yudIz";

let ACCESS_TOKEN = null;
let CURRENT_PLAYER_ID = null;

let hubData = {
    profile: null,
    character: null,
    avatar: null,
    progression: null,
    wallet: null,
    bankAccounts: [],
    inventory: [],
    homes: [],
    businesses: [],
    achievements: [],
    notifications: [],
    relationships: [],
    contacts: [],
    lumina: null
};


/* ==========================================
   HELPERS
========================================== */

function headers() {

    return {
        "apikey": SUPABASE_KEY,
        "Authorization":
            "Bearer " + ACCESS_TOKEN,
        "Content-Type":
            "application/json"
    };
}


function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function pretty(value) {

    if (!value) {
        return "Unknown";
    }

    return String(value)
        .replaceAll("_", " ")
        .replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );
}


function lumen(value) {

    return Number(
        value || 0
    ).toLocaleString();
}


async function get(path) {

    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/" +
            path,
            {
                headers: headers()
            }
        );

    if (!response.ok) {

        const message =
            await response.text();

        throw new Error(
            message ||
            "Everwyn could not load this data."
        );
    }

    return response.json();
}


/* ==========================================
   SESSION
========================================== */
function loadSession() {

    ACCESS_TOKEN =
        sessionStorage.getItem("everwyn_access_token") ||
        localStorage.getItem("everwyn_access_token");

    if (!ACCESS_TOKEN) {

        window.location.href = "login.html";

        return false;
    }

    return true;
}

async function resolvePlayer() {

    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/rpc/ensure_player_for_profile",
            {
                method: "POST",
                headers: headers(),
                body: "{}"
            }
        );

    if (!response.ok) {

        if (
            response.status === 401
        ) {

            localStorage.removeItem(
                "everwyn_access_token"
            );

            window.location.href =
                "login.html";

            return;
        }

        throw new Error(
            "Everwyn could not identify your player."
        );
    }

    CURRENT_PLAYER_ID =
        await response.json();

    localStorage.setItem(
        "everwyn_player_id",
        String(CURRENT_PLAYER_ID)
    );
}


/* ==========================================
   LOAD DATA
========================================== */

async function loadData() {

    const id =
        encodeURIComponent(
            CURRENT_PLAYER_ID
        );

    const results =
        await Promise.allSettled([

            get(
                "profile_players" +
                "?player_id=eq." +
                id +
                "&select=profile_id"
            ),

            get(
                "player_characters" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_avatars" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_progression" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_wallets" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_bank_accounts" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_inventory" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_homes" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_businesses" +
                "?owner_player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_achievements" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_notifications" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_relationships" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "player_contacts" +
                "?player_id=eq." +
                id +
                "&select=*"
            ),

            get(
                "lumina_devices" +
                "?player_id=eq." +
                id +
                "&select=*"
            )

        ]);


    const value =
        index => {

            const result =
                results[index];

            if (
                result.status ===
                "fulfilled"
            ) {
                return result.value;
            }

            console.warn(
                "Hub data request failed:",
                result.reason
            );

            return [];
        };


   const links = value(0);

const playerCharacters = value(1);

hubData.character =
    playerCharacters.find(
        character =>
            character.character_creation_complete === true
    ) || playerCharacters[0] || null;

hubData.avatar =
    value(2)[0] || null;
    hubData.progression =
        value(3)[0] || null;

    hubData.wallet =
        value(4)[0] || null;

    hubData.bankAccounts =
        value(5);

    hubData.inventory =
        value(6);

    hubData.homes =
        value(7);

    hubData.businesses =
        value(8);

    hubData.achievements =
        value(9);

    hubData.notifications =
        value(10);

    hubData.relationships =
        value(11);

    hubData.contacts =
        value(12);

    hubData.lumina =
        value(13)[0] || null;


    if (links.length) {

        const profileId =
            encodeURIComponent(
                links[0].profile_id
            );

        const profiles =
            await get(
                "profiles" +
                "?id=eq." +
                profileId +
                "&select=*"
            );

        hubData.profile =
            profiles[0] || null;
    }
}


/* ==========================================
   RENDER ROOM HUD
========================================== */

function renderRoom() {

    const character =
        hubData.character || {};

    const avatar =
        hubData.avatar || {};

    const progression =
        hubData.progression || {};

    const wallet =
        hubData.wallet || {};


    const name =
        character.character_name ||
        avatar.avatar_name ||
        "Traveler";


    const level =
        progression.level || 1;


    const xp =
        Number(
            progression.current_xp ||
            0
        );


    document.getElementById(
        "playerName"
    ).textContent =
        name;


    document.getElementById(
        "playerMeta"
    ).textContent =
        "Lv. " +
        level +
        " • " +
        xp.toLocaleString() +
        " XP";


    document.getElementById(
        "characterLabel"
    ).textContent =
        name;


    document.getElementById(
        "walletAmount"
    ).textContent =
        lumen(
            wallet.lumen_balance
        );


    document.getElementById(
        "xpFill"
    ).style.width =
        Math.min(
            xp % 100,
            100
        ) +
        "%";


    if (
        avatar.avatar_image_url
    ) {

        document.getElementById(
            "playerPortrait"
        ).innerHTML =
            '<img src="' +
            escapeHTML(
                avatar.avatar_image_url
            ) +
            '" alt="Character portrait">';
    }
}

function openPanel(

    html
) {

        "panelBody"
    ).innerHTML =
        html;

    document.getElementById(
        "panelOverlay"
    ).classList.add(
        "open"
    );
}


function closePanel() {

    document.getElementById(
        "panelOverlay"
    ).classList.remove(
        "open"
    );
}


function list(
    items,
    formatter,
    empty
) {

    if (!items.length) {

        return (
            "<div class='panel-card'>" +
            escapeHTML(empty) +
            "</div>"
        );
    }

    return items
        .map(formatter)
        .join("");
}

        html =

            "<div class='panel-card'>" +
            "<strong>" +
            lumen(
                hubData.wallet
                    ?.lumen_balance
            ) +
            " Lumen</strong><br>" +
            "Available balance" +
            "</div>";
    }


    else if (app === "bank") {

        html =
            "<h2>Lumen Bank</h2>" +

            list(
                hubData.bankAccounts,

                account =>
                    "<div class='panel-card'>" +
                    "<strong>" +
                    escapeHTML(
                        account.account_name
                    ) +
                    "</strong><br>" +
                    lumen(
                        account.balance
                    ) +
                    " Lumen" +
                    "</div>",

                "No bank accounts found."
            );
    }


    else if (
        app ===
        "notifications"
    ) {

        html =
            "<h2>Notifications</h2>" +

            list(
                hubData.notifications,

                notification =>
                    "<div class='panel-card'>" +
                    "<strong>" +
                    escapeHTML(
                        notification.title
                    ) +
                    "</strong><br>" +
                    escapeHTML(
                        notification.message
                    ) +
                    "</div>",

                "No notifications."
            );
    }


    else if (
        app ===
        "friends"
    ) {

        html =
            "<h2>Friends</h2>" +

            "<div class='panel-card'>" +
            hubData.contacts.length +
            " contacts<br>" +
            hubData.relationships.length +
            " relationships" +
            "</div>";
    }


    else if (
        app ===
        "messages"
    ) {

        html =
            "<h2>Messages</h2>" +

            "<div class='panel-card'>" +
            "Your Lumina messaging system is connected to Everwyn's conversation backend. Full message sending will be activated when we add the secure chat write system." +
            "</div>";
    }


    else if (
        app ===
        "market"
    ) {

        html =
            "<h2>Marketplace</h2>" +

            "<div class='panel-card'>" +
            "Player listings, trading and shops will appear here." +
            "</div>";
    }


    else if (
        app ===
        "profile"
    ) {

        html =
            "<h2>Profile</h2>" +

            "<div class='panel-card'>" +
            "<strong>@" +
            escapeHTML(
                hubData.profile
                    ?.username ||
                "traveler"
            ) +
            "</strong><br>" +

            escapeHTML(
                hubData.character
                    ?.character_name ||
                "Traveler"
            ) +
            "</div>";
    }


    else if (
        app ===
        "invites"
    ) {

        html =
            "<h2>Invitations</h2>" +

            "<div class='panel-card'>" +
            "Activity, party, home and trade invitations will appear here." +
            "</div>";
    }


    else if (
        app ===
        "settings"
    ) {

        html =
            "<h2>Settings</h2>" +

            "<div class='panel-card'>" +
            "Lumina preferences and player settings will live here." +
            "</div>" +

            "<button " +
            "id='logoutFromLumina' " +
            "class='lumina-app' " +
            "style='width:100%;margin-top:10px;'>" +
            "Log Out" +
            "</button>";
    }


    document.getElementById(
        "luminaHome"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "luminaAppPage"
    ).classList.add(
        "active"
    );


    content.innerHTML =
        html;


    const logout =
        document.getElementById(
            "logoutFromLumina"
        );


    if (logout) {

        logout.addEventListener(
            "click",
            logoutPlayer
        );
    }
}


/* ==========================================

========================================== */

function openBottomPanel(
    panel
) {

    if (
        panel ===
        "character"
    ) {

        openWardrobe();
        return;
    }


    if (
        panel ===
        "decor"
    ) {

        const home =
            hubData.homes[0];

        openPanel(
            "Home Decor",

            home
                ? (
                    "<div class='panel-card'>" +
                    "<strong>" +
                    escapeHTML(
                        home.home_name
                    ) +
                    "</strong><br>" +
                    pretty(
                        home.home_type
                    ) +
                    "<br>" +
                    "Interior: " +
                    pretty(
                        home.interior_style
                    ) +
                    "</div>" +

                    "<div class='panel-card'>" +
                    "Furniture placement and room customization will use Everwyn's existing home inventory and placed-item systems." +
                    "</div>"
                )
                : (
                    "<div class='panel-card'>" +
                    "No home found." +
                    "</div>"
                )
        );

        return;
    }


    if (
        panel ===
        "relationships"
    ) {

        openPanel(
            "Relationships",

            list(
                hubData.relationships,

                relationship =>
                    "<div class='panel-card'>" +
                    "<strong>" +
                    pretty(
                        relationship

                    ) +
                    "</strong><br>" +
                    "Level: " +

    if (

    if (

        openPanel(

========================================== */

function logoutPlayer() {

    localStorage.removeItem(
        "everwyn_access_token"
    );

    localStorage.removeItem(
        "everwyn_refresh_token"
    );

    localStorage.removeItem(
        "everwyn_user_id"
    );

    localStorage.removeItem(
        "everwyn_player_id"
    );

    window.location.href =
        "login.html";
}

/* ==========================================
   START
========================================== */

async function startHome() {

    try {

        if (!loadSession()) {
            return;
        }


        document.getElementById(
            "loadingText"
        ).textContent =
            "Finding your Everwyn identity...";


        await resolvePlayer();


        if (!CURRENT_PLAYER_ID) {
            return;
        }


        document.getElementById(
            "loadingText"
        ).textContent =
            "Preparing your room...";


        await loadData();


        if (
            !hubData.character ||
            hubData.character
                .character_creation_complete !==
                true
        ) {

            window.location.href =
                "character-creator.html";

            return;
        }


        renderRoom();


        document.getElementById(
            "loadingScreen"
        ).classList.add(
            "hidden"
        );

    }

    catch (error) {

        console.error(
            "Everwyn home error:",
            error
        );


        document.getElementById(
            "loadingText"
        ).textContent =
            "Everwyn could not load your home.";
    }
}


startHome();
